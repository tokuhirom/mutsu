[[divergence]]
dist = "Concurrent::BoundedChannel"
file = "t/01-sanity.rakutest"
shape = { verdict = "fail", ok = 35, nok = 4, plan = 39, first_failure = "not ok 27 -" }
issue = 17566
reason = """test 27 (`is($bc.offer(3), Nil)` right after `offer(2)` woke a parked receiver) holds only \
if the woken receiver re-takes the channel's `Lock` before the main thread re-locks it. Nothing \
orders the two: `Lock` is not a hand-off lock on rakudo either, and rakudo loses the same race \
under parallel load (1/12 runs; mutsu 8/12). Tests 29/30 then fail on the stale item. mutsu will \
not adopt a hand-off lock to win a test-side race (maintainer decision 2026-11-12, #17566)."""

