[[divergence]]
dist = "Code::Coverage"
file = "t/01-basic.rakutest"
shape = { verdict = "fail", ok = 9, nok = 5, plan = 14, first_failure = "is the first coverage ok" }
issue = 15323
reason = """the test compares MVM_COVERAGE_LOG line numbers, and rakudo's log carries three MoarVM \
line-table artefacts: line 1 of the unit (the mainline's entry frame, a comment line), only the \
first of several consecutive `has` declarations (16, never 17/18), and the last statement line \
seen at compile time (33, a not-taken else branch) for the mainline's implicit return. mutsu \
will not emulate them (maintainer decision 2026-10-29, #15323)."""

[[divergence]]
dist = "Datastar::SDK"
file = "t/02-signals.rakutest"
shape = { verdict = "fail", ok = 18, nok = 1, plan = 19, first_failure = "rejects an invalid Unicode scalar during serialization" }
issue = 14416
reason = """the test expects `to-json(chr(0xD800))` to die `X::AdHoc`: rakudo keeps the surrogate in a \
`Str` (`chr(0xD800).ord` is 55296) and fails only when JSON::Fast encodes it. mutsu does not keep a \
surrogate in a `Str`; `chr(0xD800)` raises `X::InvalidCodepoint` at construction, as roast's \
`ord_and_chr.t` (`dies-ok {chr(0xD800)}`) and S15 specify (ADR-12640 rejected, maintainer decision \
2026-10-21, #14416)."""

[[divergence]]
dist = "Dev::ContainerizedService"
file = "t/clickhouse.t"
shape = { verdict = "fail", ok = 0, nok = 7, plan = 7, first_failure = "Successfully ran development script" }
issue = 15525
reason = """the test probes `require ::('Cro::HTTP::Client')` and skips when it is absent. The \
oracle rakudo has no Cro, so it skips; mutsu bundles Cro::HTTP::Client, so the test runs its \
real flow and needs a Docker daemon the sweep sandbox does not have. Hiding the bundled module \
from `require` would not be a fix (user decision 2026-11-03, #15525)."""

[[divergence]]
dist = "DSL::Shared"
file = "t/Array-of-regexes-matches.rakutest"
shape = { verdict = "fail", ok = 6, nok = 1, plan = 7, first_failure = "not ok 6 -" }
issue = 9746
reason = """rakudo caches a Str interpolated as <$rx> by mixing Match::CachedCompiledRegex \
into that Str object in place, changing its .WHICH; a later `'string' (elem) @knownRegexes` \
is then False and test 6 takes the :all path. mutsu does not reproduce the cache artefact \
(user decision 2026-09-27)."""

[[divergence]]
dist = "NativeHelpers::Blob"
file = "t/02-cstruct.rakutest"
shape = { verdict = "die", ok = 0, nok = 0, plan = 34, first_failure = "Unknown VM; don't know how to compile test libraries" }
issue = 12829
reason = """the test's own helper t/CompileTestLib.rakumod dispatches on `$*VM.name` (moar/jvm) \
and dies on anything else; mutsu reports 'mutsu' and will not claim 'moar' (same decision as \
LibraryMake, user decision 2026-09-25). With the helper's check bypassed all 34 assertions pass \
under mutsu."""

[[divergence]]
dist = "Template::HAML"
file = "t/0510-precomp-cross-process.rakutest"
shape = { verdict = "fail", ok = 5, nok = 1, plan = 6, first_failure = ".precomp directory created after first render" }
issue = 16451
reason = """test 1 asserts that `<root>/.precomp` exists after a `require` through a \
`CompUnit::Repository::FileSystem`. That is rakudo's storage layout, not something the language \
or roast specifies; mutsu keeps its precompilation store in a per-user, content-keyed cache and \
will not write into the user's source tree (ADR-11756, docs/security.md). Tests 2-6 pass \
(maintainer decision 2026-11-08, ADR-16451 option (c))."""
