[[divergence]]
dist = "Linux::NFTables"
file = "t/02-oo.rakutest"
shape = { verdict = "die", ok = 2, nok = 0, first_failure = [
  "free(): invalid pointer",
  "double free or corruption (out)",
  "free(): double free detected in tcache 2",
  "munmap_chunk(): invalid pointer",
  "mutsu crash report",
  "re:Internal error: index out of bounds: the len is \\d+ but the index is \\d+",
  "re:thread 'mutsu-main' \\(\\d+\\) panicked at .*",
] }
issue = 17834
reason = """every assertion has passed (ok = 2) when the process dies: the class's \
`submethod DESTROY { nft_ctx_free($!ctx) }` runs once `$nft` leaves the subtest, and libnftables \
double-frees a context `nft_ctx_clear_vars` was called on. The heap corruption surfaces as a \
different first line on each run, hence the alternatives. rakudo dies identically once a forced \
GC (`$*VM.request-garbage-collection`) runs that DESTROY; it passes only because MoarVM never \
collects the object before exit, and DESTROY timing is unspecified (maintainer decision \
2026-11-17, #17834)."""

[[divergence]]
dist = "MCP::Server"
file = "t/21-elicitation-dispatch.rakutest"
shape = { verdict = "fail", ok = 11, nok = 1, plan = 12, first_failure = "A round that answers only some of the questions" }
issue = 17724
reason = """the subtest assumes both `start`ed handlers have asked before the dispatcher's \
`Promise.anyof` wake-up snapshots the round, and that `alpha` got the first key. rakudo passes \
only on a cold pool, where one worker runs both blocks and the wake-up in FIFO order; after a \
16-task pool warm-up it fails the same subtest in the same two ways (inner `not ok 1`/`3` or \
`not ok 5`) 12 runs of 25. Nothing in the language orders two tasks' bodies, and mutsu will not \
port rakudo's lazy pool activation to reproduce it (ADR-15967 §2.1/§3/§5, ADR-0105 §5; user \
decision 2026-11-19, #17724, #14684)."""

