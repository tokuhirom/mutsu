name: Label PR by title

# Applies a category label to each PR from its conventional-commit title prefix
# so the release notes (see .github/release.yml) can group PRs into sections.
# mutsu PRs follow the `type:` / `type(scope):` convention rather than carrying
# labels by hand, so this derives the label from the title the author already
# writes. Dependabot PRs are skipped — Dependabot labels them `dependencies`
# itself (and its token is read-only here anyway).
on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Apply category label from title prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # Extract the conventional-commit type and optional (scope):
          #   "fix(regex)!: ..." -> type=fix scope=regex
          type=$(printf '%s' "$TITLE" | sed -nE 's/^([a-zA-Z]+)(\([^)]*\))?!?:.*/\1/p' | tr '[:upper:]' '[:lower:]')
          scope=$(printf '%s' "$TITLE" | sed -nE 's/^[a-zA-Z]+\(([^)]*)\)!?:.*/\1/p' | tr '[:upper:]' '[:lower:]')

          # Any `*(deps):` (or a bare `deps:`) is a dependency bump -> Dependencies.
          if [ "$scope" = deps ] || [ "$type" = deps ]; then
            label=dependencies
          else
            case "$type" in
              feat) label=feat ;;
              fix) label=fix ;;
              perf) label=perf ;;
              docs) label=docs ;;
              chore|refactor|test|ci|build|style) label=maintenance ;;
              *) label="" ;;
            esac
          fi

          echo "title=$TITLE -> type=$type scope=$scope label=${label:-<none>}"

          # Clear stale category labels a re-typed title may have left behind, then
          # apply the current one. (`dependencies` is owned by Dependabot; leave it.)
          for c in feat fix perf docs maintenance; do
            if [ "$c" != "$label" ]; then
              gh pr edit "$PR" --repo "$REPO" --remove-label "$c" 2>/dev/null || true
            fi
          done
          if [ -n "$label" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label "$label"
          fi
