# The whole of site/ — the landing page, the manual, the batteries and
# ecosystem listings, the bench-trend dashboard, and the wasm playground among
# them. It stopped being "the WASM demo" long ago (site/README.md: "It is
# mutsu's home page, not a WebAssembly demo").
name: Deploy the site to GitHub Pages

on:
  # EVERY push to main deploys, with no `paths:` filter. This job used to build
  # the wasm playground from source, which is why it was narrowed to the files
  # that change the site itself; it does not any more — the interpreter comes
  # from the published npm package (`npm install @tokuhirom/mutsu@latest`), and
  # what is left is a node install and four small generator scripts. Measured
  # end to end on 2026-09-21: 30, 35, 36, 37, 41, 47 seconds. At that price a
  # path filter costs more than it saves, because every path it omits is a way
  # for the deployed site to disagree with `main`:
  #
  #   - `roast-whitelist.txt` is the landing page's "N% of the official spec
  #     files pass in full", counted at deploy time. It grows several times a
  #     day and was on no push path at all, so that headline figure was only
  #     ever refreshed by the daily cron below -- up to 24 hours behind.
  #   - `roast/` itself is the denominator of the same figure, so a re-vendor
  #     moved it with no trigger either.
  #   - Anything a future generator script starts reading is covered from the
  #     moment it is written, rather than the first time someone notices the
  #     page is stale and remembers to extend a list in this file.
  #
  # What this does NOT change: the playground still runs the interpreter from
  # the last published npm package, not from HEAD. Deploying more often cannot
  # fix that — only a release can, which the `Release` workflow_run below
  # already picks up.
  #
  # The burst case is already handled by the `concurrency` group further down
  # (`cancel-in-progress: true`): when several PRs merge within a minute — which
  # happens here routinely — the superseded runs are cancelled and only the last
  # one deploys. That is what makes an unfiltered trigger safe rather than a way
  # to queue twenty deploys of the same tree.
  #
  # Note that the ecosystem parity data needs no trigger of its own: a sweep
  # lands its records as a pull request into main (ecosystem-sweep.yml), so that
  # merge is an ordinary push — which is the right moment, because the records
  # are only in the tree this job checks out once they are merged. Do NOT "fix"
  # this by adding `Ecosystem sweep` to the workflow_run list: that fires while
  # the pull request is still open and would deploy the previous sweep's
  # numbers.
  #
  # The daily schedule remains the safety net for what no push can signal: an
  # npm package published outside a tagged release, and a stretch of days with
  # no merges at all.
  schedule:
    - cron: '17 21 * * *'
  push:
    branches: [main]
  workflow_run:
    # Release: a successful tagged release publishes npm before the Release
    # workflow completes, so this deploy picks up the new `latest` package
    # automatically.
    #
    # Bench: bench-trend.html is rendered from the `bench-data` branch, and
    # bench.yml pushes there with the default GITHUB_TOKEN — a push GitHub
    # deliberately does not let start a workflow, on a branch this workflow
    # does not watch anyway. So no `push:` filter can ever see new perf data;
    # completion of the run that produced it is the only signal there is.
    # Waiting for the daily cron instead left the published trend up to 24
    # hours behind, and this ordering also closes the one-commit lag the
    # render step used to document: the row for the commit being measured is
    # already on `bench-data` by the time this fires.
    workflows: [Release, Bench]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # A failed upstream run produced nothing to publish. Beyond that the two
    # watched workflows differ: a `workflow_dispatch` Release run uploads
    # artifacts but creates no release and publishes no npm package, so there
    # is nothing new for this deploy to pick up and only a tag push counts —
    # whereas Bench appends its row to `bench-data` however it was started, so
    # a dispatched Bench run is just as much a reason to redeploy as a pushed
    # one.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.name != 'Release' ||
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install the published browser package
        run: |
          npm install --prefix tmp/pages-package --ignore-scripts --no-audit --no-fund \
            @tokuhirom/mutsu@latest
          mkdir -p site/pkg
          cp -R tmp/pages-package/node_modules/@tokuhirom/mutsu/. site/pkg/
          node -e 'const p = require("./site/pkg/package.json"); console.log(`using ${p.name}@${p.version}`)'

      - name: Generate the batteries listing
        # The batteries page (batteries.html) is generated from the vendored
        # modules/ tree so it can never drift from what the binary ships. The
        # committed snapshot is regenerated here at deploy time to pick up any
        # module vendored since it was last committed.
        run: |
          python3 scripts/gen-batteries-manifest.py
          cat site/content/batteries.json | python3 -c \
            'import json,sys; print("bundled:", ", ".join(l["name"] for l in json.load(sys.stdin)["libraries"]))'

      - name: Generate the ecosystem compatibility listing
        # ecosystem.html answers "does my module work on mutsu?" from the parity
        # ledger (ecosystem/dists/**.json), so like the batteries page it is
        # generated rather than hand-written and cannot drift from the
        # measurements. The chart is copied alongside it when a full sweep has
        # produced one. Best-effort: a checkout with no records yet deploys the
        # page with an "not measured yet" state rather than failing the deploy.
        run: |
          python3 scripts/gen-ecosystem-manifest.py || \
            echo '{"distributions":[],"counts":{"green":0,"graded":0},"dist_parity":0,"file_parity":0,"measured":{}}' \
              > site/content/ecosystem.json
          cp ecosystem/history.svg site/history.svg 2>/dev/null || true

      - name: Record compatibility stats
        # The landing page headlines "N% of the official spec files pass". Count
        # it here rather than hand-writing it into the copy, so the figure cannot
        # drift away from the suite (the README's did). The site falls back to a
        # baked-in number when this file is absent, i.e. in a local checkout.
        run: |
          pass=$(grep -c . roast-whitelist.txt)
          total=$(find roast -name '*.t' -type f | wc -l)
          printf '{"roastPass":%d,"roastTotal":%d}\n' "$pass" "$total" \
            > site/content/stats.json
          cat site/content/stats.json

      - name: Render bench-trend dashboard
        # Pull the perf history from the bench-data branch and render it into the
        # deployed site as bench-trend.html, so the trend is viewable at
        # <pages-url>/bench-trend.html with no download. On the `workflow_run`
        # trigger this fires after Bench finished, so the row for the commit it
        # measured is already here; on any other trigger the history is simply
        # whatever `bench-data` holds at that moment. (Before the Bench trigger
        # existed, a `site/**` push raced bench.yml's append and this page was
        # reliably one commit behind.) Best-effort: if bench-data has no history
        # yet, skip without failing the deploy.
        #
        # BOTH series are rendered onto one page (#8085): the wall-clock one and
        # the deterministic instruction-count one, as metric buttons on the same
        # commit axis, because the whole point is to read them together — the
        # deterministic series localizes a change to ~0.1%, the wall-clock one
        # says whether it mattered. `--det` is optional and a missing file is not
        # an error, which is what the window before bench.yml has recorded its
        # first deterministic row needs.
        run: |
          git fetch --depth 1 origin bench-data 2>/dev/null || true
          if git show FETCH_HEAD:bench-history.tsv > /tmp/bench-history.tsv 2>/dev/null; then
            det=()
            if git show FETCH_HEAD:bench-det-history.tsv > /tmp/bench-det-history.tsv 2>/dev/null; then
              det=(--det /tmp/bench-det-history.tsv)
            else
              echo "no bench-det-history.tsv on bench-data yet; rendering wall clock only"
            fi
            python3 scripts/bench-visualize.py --standalone --site-chrome \
              "${det[@]}" /tmp/bench-history.tsv -o site/bench-trend.html
          else
            echo "no bench-history.tsv on bench-data yet; skipping bench-trend"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
