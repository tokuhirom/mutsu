# The whole of site/ — the landing page, the manual, the batteries and
# ecosystem listings, the bench-trend dashboard, and the wasm playground among
# them. It stopped being "the WASM demo" long ago (site/README.md: "It is
# mutsu's home page, not a WebAssembly demo").
name: Deploy the site to GitHub Pages

# `workflow_run` is safe here: the build checks out `main` itself and consumes
# nothing (no artifact, no output) from the run that triggered it.
on: # zizmor: ignore[dangerous-triggers]
  # On a schedule, not on every push to main (ADR-11581). Hosted-runner concurrency (20
  # jobs on the free plan) is shared with the CI that gates every PR, and at
  # ~100 merges a day a deploy per push -- plus a second one per completed
  # Bench run -- queued ~200 small jobs a day in front of PR CI for a site
  # whose readers do not need minute-level freshness. Every two hours bounds
  # how far the site can lag `main`: the landing page's roast figure (counted
  # from `roast-whitelist.txt` at deploy time), the bench trend (rendered from
  # the `bench-data` branch, which bench.yml pushes to with the default
  # GITHUB_TOKEN and so can signal no workflow), and whatever a future
  # generator script starts reading. `workflow_dispatch` deploys at once when
  # that is not soon enough.
  #
  # No `paths:` filter on top of the schedule: every path a filter omits is a
  # way for the deployed site to disagree with `main`.
  #
  # What this does NOT change: the playground runs the interpreter from the
  # last published npm package, not from HEAD; only a release moves it, which
  # the `Release` workflow_run below picks up.
  schedule:
    - cron: '17 */2 * * *'
  workflow_run:
    # Release: a successful tagged release publishes npm before the Release
    # workflow completes, so this deploy picks up the new `latest` package
    # right away rather than at the next scheduled run.
    #
    # Ecosystem sweep: the parity records live on the `ecosystem-data` branch,
    # which ecosystem-sweep.yml pushes to with the default GITHUB_TOKEN, so the
    # run's completion is the only signal that new numbers exist (ADR-0085,
    # 2026-10-03 amendment). It runs once a day, so this costs one deploy.
    workflows: [Release, Ecosystem sweep]
    types: [completed]
  workflow_dispatch:

# Only the `deploy` job writes (Pages + the OIDC token deploy-pages needs).
permissions:
  contents: read


jobs:
  build:
    # A failed upstream run produced nothing to publish. A `workflow_dispatch`
    # Release run uploads artifacts but creates no release and publishes no npm
    # package, so only a tag push counts. An Ecosystem sweep run counts whatever
    # its conclusion: one failed shard fails the run, yet its `collect` job
    # still lands the other 26.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.name == 'Ecosystem sweep' &&
       github.event.workflow_run.conclusion != 'cancelled') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    # The cancelling group lives on the JOB, not the workflow: a workflow-level
    # group is entered by every run, including the `workflow_run` ones the
    # `if:` above skips, and such a skipped run used to cancel a real deploy
    # (2026-10-03). A job whose `if:` is false never enters the group.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install the published browser package
        run: |
          npm install --prefix tmp/pages-package --ignore-scripts --no-audit --no-fund \
            @tokuhirom/mutsu@latest
          # The playground serves this package to every visitor, so check the
          # registry signature and the provenance attestation npm trusted
          # publishing attaches (release.yml, `release` environment) before
          # deploying it.
          (cd tmp/pages-package && npm audit signatures)
          mkdir -p site/pkg
          cp -R tmp/pages-package/node_modules/@tokuhirom/mutsu/. site/pkg/
          node -e 'const p = require("./site/pkg/package.json"); console.log(`using ${p.name}@${p.version}`)'

      - name: Generate the batteries listing
        # The batteries page (batteries.html) is generated from the vendored
        # modules/ tree so it can never drift from what the binary ships. The
        # committed snapshot is regenerated here at deploy time to pick up any
        # module vendored since it was last committed.
        run: |
          python3 scripts/gen-batteries-manifest.py
          cat site/content/batteries.json | python3 -c \
            'import json,sys; print("bundled:", ", ".join(l["name"] for l in json.load(sys.stdin)["libraries"]))'

      - name: Generate the ecosystem compatibility listing
        # ecosystem.html answers "does my module work on mutsu?" from the parity
        # ledger (ecosystem/dists/**.json on the `ecosystem-data` branch), so
        # like the batteries page it is generated rather than hand-written and
        # cannot drift from the measurements. The chart is copied alongside it
        # when a full sweep has produced one. Best-effort: with no ledger to
        # fetch, the page deploys in a "not measured yet" state rather than
        # failing the deploy.
        run: |
          scripts/ecosystem-ledger.sh pull || echo "no ecosystem ledger to fetch"
          python3 scripts/gen-ecosystem-manifest.py || \
            echo '{"distributions":[],"counts":{"green":0,"graded":0},"dist_parity":0,"file_parity":0,"measured":{}}' \
              > site/content/ecosystem.json
          cp ecosystem/history.svg site/history.svg 2>/dev/null || true

      - name: Generate the Internals reference data
        # opcodes.html and types.html list every VM opcode, every Value kind
        # and the built-in type tree. Those lists are read out of src/ here
        # (not committed) so the published pages always describe the commit
        # being deployed. Unlike the ecosystem listing this is NOT best-effort:
        # a parse failure means the source layout changed under the script,
        # and publishing an empty reference would hide that.
        run: python3 scripts/gen-internals-manifest.py

      - name: Record compatibility stats
        # The landing page headlines "N% of the official spec files pass". Count
        # it here rather than hand-writing it into the copy, so the figure cannot
        # drift away from the suite (the README's did). The site falls back to a
        # baked-in number when this file is absent, i.e. in a local checkout.
        run: |
          pass=$(grep -c . roast-whitelist.txt)
          total=$(find roast -name '*.t' -type f | wc -l)
          printf '{"roastPass":%d,"roastTotal":%d}\n' "$pass" "$total" \
            > site/content/stats.json
          cat site/content/stats.json

      - name: Render bench-trend dashboard
        # Pull the perf history from the bench-data branch and render it into the
        # deployed site as bench-trend.html, so the trend is viewable at
        # <pages-url>/bench-trend.html with no download. It shows whatever
        # `bench-data` holds when this runs -- at most one schedule interval
        # behind bench.yml's last append. Best-effort: if bench-data has no history
        # yet, skip without failing the deploy.
        #
        # BOTH series are rendered onto one page (#8085): the wall-clock one and
        # the deterministic instruction-count one, as metric buttons on the same
        # commit axis, because the whole point is to read them together — the
        # deterministic series localizes a change to ~0.1%, the wall-clock one
        # says whether it mattered. `--det` is optional and a missing file is not
        # an error, which is what the window before bench.yml has recorded its
        # first deterministic row needs.
        run: |
          git fetch --depth 1 origin bench-data 2>/dev/null || true
          if git show FETCH_HEAD:bench-history.tsv > /tmp/bench-history.tsv 2>/dev/null; then
            det=()
            if git show FETCH_HEAD:bench-det-history.tsv > /tmp/bench-det-history.tsv 2>/dev/null; then
              det=(--det /tmp/bench-det-history.tsv)
            else
              echo "no bench-det-history.tsv on bench-data yet; rendering wall clock only"
            fi
            python3 scripts/bench-visualize.py --standalone --site-chrome \
              "${det[@]}" /tmp/bench-history.tsv -o site/bench-trend.html
          else
            echo "no bench-history.tsv on bench-data yet; skipping bench-trend"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    # Queued, not cancelled: a deploy that started publishes a complete
    # artifact, and a newer pending one replaces an older pending one anyway.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
