name: Deploy WASM Demo to GitHub Pages

on:
  # The interpreter comes from the latest published npm package. Keep the push
  # trigger narrowed to files that change the site itself; a newly published
  # interpreter can be picked up immediately with workflow_dispatch.
  #
  # Deliberately NOT listed: `src/**`. Nearly every commit touches it, which
  # would restore the every-merge build. The consequence is that the playground
  # runs the interpreter from the last deploy, not from HEAD — when you want it
  # to pick up interpreter changes, trigger this workflow by hand
  # (`gh workflow run pages.yml`, or the "Run workflow" button).
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'modules/**'                   # the batteries page lists these
      - 'scripts/bench-visualize.py'   # renders bench-trend.html
      - 'scripts/gen-batteries-manifest.py'
      - '.github/workflows/pages.yml'
  # A successful tagged release publishes npm before the Release workflow
  # completes, so this deploy picks up the new `latest` package automatically.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install the published browser package
        run: |
          npm install --prefix tmp/pages-package --ignore-scripts --no-audit --no-fund \
            @tokuhirom/mutsu@latest
          mkdir -p site/pkg
          cp -R tmp/pages-package/node_modules/@tokuhirom/mutsu/. site/pkg/
          node -e 'const p = require("./site/pkg/package.json"); console.log(`using ${p.name}@${p.version}`)'

      - name: Generate the batteries listing
        # The batteries page (batteries.html) is generated from the vendored
        # modules/ tree so it can never drift from what the binary ships. The
        # committed snapshot is regenerated here at deploy time to pick up any
        # module vendored since it was last committed.
        run: |
          python3 scripts/gen-batteries-manifest.py
          cat site/content/batteries.json | python3 -c \
            'import json,sys; print("bundled:", ", ".join(l["name"] for l in json.load(sys.stdin)["libraries"]))'

      - name: Record compatibility stats
        # The landing page headlines "N% of the official spec files pass". Count
        # it here rather than hand-writing it into the copy, so the figure cannot
        # drift away from the suite (the README's did). The site falls back to a
        # baked-in number when this file is absent, i.e. in a local checkout.
        run: |
          pass=$(grep -c . roast-whitelist.txt)
          total=$(find roast -name '*.t' -type f | wc -l)
          printf '{"roastPass":%d,"roastTotal":%d}\n' "$pass" "$total" \
            > site/content/stats.json
          cat site/content/stats.json

      - name: Render bench-trend dashboard
        # Pull the perf history from the bench-data branch and render it into the
        # deployed site as bench-trend.html, so the trend is viewable at
        # <pages-url>/bench-trend.html with no download. The data is up to the
        # PREVIOUS main commit — bench.yml appends the current commit's row
        # concurrently, so this page catches up on the next push (a ~1-commit
        # lag, fine for a trend view). Best-effort: if bench-data has no history
        # yet, skip without failing the deploy.
        run: |
          git fetch --depth 1 origin bench-data 2>/dev/null || true
          if git show FETCH_HEAD:bench-history.tsv > /tmp/bench-history.tsv 2>/dev/null; then
            python3 scripts/bench-visualize.py --standalone --site-chrome \
              /tmp/bench-history.tsv -o site/bench-trend.html
          else
            echo "no bench-history.tsv on bench-data yet; skipping bench-trend"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
