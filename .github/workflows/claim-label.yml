name: Sync the `working` label from the claim log

# docs/issue-workflow.md makes an issue's comment thread the record of who is
# working on it, and the `working` label a fast filter over that record. Keeping
# the two in sync by hand did not work: agents post the `Claiming:` comment and
# then forget the label (#8033 was claimed for six hours without it), so the
# filter lies in the one direction that costs a build slot -- an issue that
# looks free while somebody is on it.
#
# So the label is no longer written by hand at all. This replays the claim log
# and makes the label agree with it:
#
#   * a comment whose first line is `Claiming: <branch>` -> the label goes on
#   * the matching `Releasing: <branch>`                 -> it comes off
#
# An agent that still adds or removes the label itself changes nothing; the run
# is idempotent.
#
# The scheduled run additionally breaks a claim whose session died, by the
# evidence-based test docs/issue-workflow.md already defines for the ecosystem
# lock board (older than 24h AND no such branch on origin), and prints the live
# claims as a board in the run summary.

on:
  issue_comment:
    types: [created, edited, deleted]
  issues:
    # A close is the one event that most reliably means the work is over, and
    # it posts no comment -- so nothing in the `issue_comment`-driven pipeline
    # ever saw it (#8256), and a closed issue kept reading as claimed forever.
    # `reopened` is the mirror: put the label back if a claim is still live.
    types: [closed, reopened]
  schedule:
    # Every three hours. The label itself is event-driven; this run exists to
    # expire dead claims and to catch an event that was never delivered.
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to reconcile (empty = every open issue)'
        required: false
        type: string
      release_stale:
        description: 'Also auto-release claims older than 24h with no branch on origin'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# One run at a time PER ISSUE: two concurrent runs over the same log would read
# it identically and issue the same label edit twice.
#
# The group must be keyed by the issue, not global. `cancel-in-progress: false`
# protects a run that is already executing, but GitHub allows only one PENDING
# run per group -- queueing a new one cancels the previously pending one. Since
# an `issue_comment` run reconciles only `github.event.issue.number` (see the
# Reconcile step), a global group let a comment on issue B cancel the pending
# run for issue A, and the run that replaced it then reconciled B instead: A's
# claim or release was simply dropped. The 3-hourly schedule below caught it
# eventually, but up to three hours late -- long enough for another agent to
# take an issue somebody is on, which is the failure this workflow exists to
# prevent. Observed on #7988: its `Releasing:` comment's run was cancelled one
# second later by an unrelated issue's, and the label stayed on for an hour
# until a manual dispatch cleared it.
#
# Collapsing two runs for the SAME issue stays correct and is the point of the
# group: each run replays that issue's whole comment log, so it is idempotent,
# and the surviving (newer) run sees strictly more comments than the one it
# replaced. The whole-queue runs (`schedule`, and a dispatch with no `issue`)
# share the `all` key and still serialise against each other.
concurrency:
  group: claim-label-${{ github.event.issue.number || inputs.issue || 'all' }}
  cancel-in-progress: false

jobs:
  sync:
    # `issue_comment` also fires for pull request comments, which carry no claim.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The claim-log parser is the fragile part (it has to survive the prose
      # agents append after the keyword line), so it pins itself before running.
      - name: Self-test the claim-log parser
        run: .github/scripts/sync-working-label.sh --self-test

      - name: Reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          RELEASE_STALE: ${{ (github.event_name == 'schedule' || inputs.release_stale) && '1' || '0' }}
        run: |
          set -eu
          {
            echo '## `working` label sync'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${ISSUE:-}" ]; then
            .github/scripts/sync-working-label.sh "$ISSUE" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            .github/scripts/sync-working-label.sh --all | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
