name: Ecosystem sweep

# Re-measure the ecosystem parity KPI (issue #7785) on hosted runners and push
# the result straight to the orphan `ecosystem-data` branch -- the `bench-data`
# pattern. This is the CI entry point to `scripts/ecosystem-sweep.py`; the
# measurements live under `ecosystem/` on that branch (main keeps only the
# hand-maintained inputs: README.md, exclude.txt, accepted-divergences.toml),
# `scripts/ecosystem-ledger.sh pull` materializes them in a checkout, and
# pages.yml publishes them to `site/ecosystem.html` when this run completes.
#
# The records are not reviewed by a human and are not meant to be: a diff of
# thousands of machine-generated measurements tells a reader nothing a reviewer
# could act on. Every guard that makes the numbers trustworthy runs before the
# commit exists (see below), and the data branch's history is the audit trail
# and the revert handle. Until 2026-10-03 each sweep instead became a pull
# request into main, opened by a scheduled agent routine because a pull request
# opened with GITHUB_TOKEN never starts CI; ADR-0085's 2026-10-03 amendment
# records why that was dropped.
#
# Method and metric definitions: docs/ecosystem-parity.md
# Decisions: docs/adr/0085-ecosystem-testsuite-parity-measurement.md (D9 + its
# 2026-09-10 amendment, which is what allows this workflow to exist).
#
# Two entry points: a nightly `schedule:` that measures the whole corpus, and
# `workflow_dispatch` for anything else (one shard, a named distribution, a
# status). The schedule was added by ADR-0085 D9's SECOND amendment
# (2026-09-11), which reversed the original "operator-run only" decision on
# measured cost: the rejection assumed ~20 CPU-hours per sweep, and the first
# real corpus run took 78 minutes of wall time and about 5.5 hours of job time
# across 27 shards. Read that amendment before changing the cadence.
#
# IMPORTANT for anyone editing this file: on a `schedule:` event `inputs.*` are
# ALL EMPTY -- a workflow_dispatch default does not apply. Every input is
# therefore read as `inputs.x || <default>`, and the two booleans as
# `inputs.x || github.event_name == 'schedule'`, so the nightly run is a full
# `scope: all` sweep that rolls up and appends a history row. Adding a new input
# means adding its fallback too, or the nightly run silently gets the empty
# value.
#
# Three things it does NOT compromise on, because they are what make the number
# mean anything (ADR-0085 D8):
#   * One binary for the whole run. `build` compiles once and every shard
#     downloads that artifact, so no shard can measure a different mutsu.
#   * One rakudo for the whole run. `build` resolves the prebuilt version and
#     every shard installs that exact release, not "the newest at the time this
#     job started".
#   * `bwrap` or nothing. The sweep runs unaudited third-party test suites; if
#     the sandbox does not work on the runner the job fails instead of quietly
#     continuing unsandboxed.
#
# Each record carries its own provenance, and `measured.host` says `gha-*` for
# anything measured here, so a CI-measured number is never silently mixed with
# one from the maintainer's box (docs/ecosystem-parity.md section 8). A run
# whose records do not share one (mutsu commit, rakudo, host) triple still
# lands its records but is refused a `history.tsv` row.

on:
  # 18:20 UTC = 03:20 JST, every day. JST has no daylight saving, so the local
  # time does not drift. Twenty past rather than on the hour: GitHub queues
  # scheduled jobs hardest at :00, and a 27-shard matrix waiting for runners is
  # the one delay this run cannot shorten.
  schedule:
    - cron: '20 18 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to measure'
        type: choice
        default: stale
        options:
          - stale        # records measured at another mutsu commit / rakudo -- "refresh the numbers"
          - all          # the whole corpus (~20 CPU-hours; fans out to 27 shards)
          - prefix       # one shard, e.g. every distribution starting with A
          - only         # named distributions
          - status       # every record currently at a given status
      prefix:
        description: 'scope=prefix: one letter A-Z, or _ for non-letter names'
        type: string
        default: ''
      only:
        description: 'scope=only: distribution names, comma or space separated'
        type: string
        default: ''
      status:
        description: 'scope=status: which record status to re-measure'
        type: choice
        default: partial
        options: [partial, red, blocked_load, blocked_dep, no_baseline, green, skipped]
      shards:
        description: 'Fan out across the 27 letter shards? auto = only for scope=all'
        type: choice
        default: auto
        options: [auto, letters, single]
      jobs:
        description: 'Parallel test processes per runner (hosted runners have 4 vCPU)'
        type: string
        default: '4'
      attempts:
        description: 'Attempts for a file that did not pass (both sides get the same budget)'
        type: string
        default: '3'
      file_timeout:
        description: 'Per-test-file timeout in seconds, both sides'
        type: string
        default: '120'
      raku_version:
        description: 'Pin the rakudo release (e.g. 2026.07); empty = newest prebuilt'
        type: string
        default: ''
      rollup:
        description: 'Regenerate ecosystem/summary.json + summary.md (skipped for a partial sweep that would create the FIRST one)'
        type: boolean
        default: true
      history:
        description: 'Append a history.tsv row + redraw the chart (full-corpus runs only)'
        type: boolean
        default: false
      publish:
        description: 'land = commit to the ecosystem-data branch; branch = an ecosystem/hold-* branch on top of it, left for a human; none = push nothing'
        type: choice
        default: land
        options: [land, branch, none]

# Read-only by default: the `sweep` shards run third-party distributions'
# test suites and must hold no write token. Only `collect` writes.
permissions:
  contents: read

# Never run two sweeps at once: they would race the same records, and the second
# one to finish would land a mixture. Queue instead of cancelling -- a cancelled
# sweep throws away hours of measurement.
concurrency:
  group: ecosystem-sweep
  cancel-in-progress: false

jobs:
  # Plan the matrix and produce the two things every shard must share: one mutsu
  # binary and one pinned rakudo release.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      count: ${{ steps.plan.outputs.count }}
      full-corpus: ${{ steps.plan.outputs.full-corpus }}
      raku-version: ${{ steps.raku.outputs.version }}
      mutsu-commit: ${{ steps.plan.outputs.mutsu-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ~1s, and it catches a dispatch typo before a release build and 27 rakudo
      # installs. `ecosystem_common` is here too because its self-test existed
      # but was wired into nothing -- including the record-filename rule, whose
      # first failure cost two shards their measurements.
      - name: Self-tests
        run: |
          set -euo pipefail
          python3 scripts/ecosystem-ci.py --self-test
          python3 scripts/ecosystem_common.py --self-test
          python3 scripts/ecosystem-sweep.py --self-test

      - name: Plan the matrix
        id: plan
        env:
          # Inputs go through the environment, never through ${{ }} inside a
          # `run:` body: the planner is what decides they are safe to word-split
          # into an argv, and it can only do that if the shell never sees them
          # first.
          SCOPE: ${{ inputs.scope || 'all' }}
          PREFIX: ${{ inputs.prefix }}
          ONLY: ${{ inputs.only }}
          STATUS: ${{ inputs.status || 'partial' }}
          SHARDS: ${{ inputs.shards || 'auto' }}
          JOBS: ${{ inputs.jobs || '4' }}
          ATTEMPTS: ${{ inputs.attempts || '3' }}
          FILE_TIMEOUT: ${{ inputs.file_timeout || '120' }}
        run: |
          set -euo pipefail
          for pair in "jobs:$JOBS" "attempts:$ATTEMPTS" "file_timeout:$FILE_TIMEOUT"; do
            name=${pair%%:*}; value=${pair#*:}
            case "$value" in
              ''|*[!0-9]*) echo "::error::$name must be a positive integer, got '$value'"; exit 1 ;;
              0) echo "::error::$name must be greater than zero"; exit 1 ;;
            esac
          done
          python3 scripts/ecosystem-ci.py plan \
            --scope "$SCOPE" --prefix "$PREFIX" --only "$ONLY" \
            --status "$STATUS" --shards "$SHARDS"
          echo "mutsu-commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "ci-ecosystem"

      # Every shard measures THIS binary. Building per shard would let 27
      # slightly different compilations produce one KPI number.
      - name: Build (release)
        run: cargo build --release
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "false"

      - name: Upload the mutsu binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutsu-release-binary
          path: target/release/mutsu
          retention-days: 1
          if-no-files-found: error

      # Fetch the fez + REA indexes ONCE, for the same reason the binary is
      # built once: the sweep resolves each distribution's version and
      # dependency closure from them, and `load_index()` reuses whatever is in
      # the cache. Without this, a shard that starts three hours later can
      # measure a different version of the same distribution, and
      # `index-snapshot.json` would then describe only whichever shard wrote it
      # last.
      - name: Fetch and pin the ecosystem index
        run: |
          set -euo pipefail
          python3 -c "import sys; sys.path.insert(0, 'scripts'); import ecosystem_common as eco; \
            i = eco.load_index(refresh=True); print(len(i.targets), 'distributions')"
          # Staged outside the cache directory because an action input is not
          # shell-expanded: `~/.cache/...` in a `with:` would create a directory
          # literally named `~`.
          cp -a "$HOME/.cache/mutsu-ecosystem/index" /tmp/eco-index

      - name: Upload the pinned index
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecosystem-index
          path: /tmp/eco-index
          retention-days: 1
          if-no-files-found: error

      # Resolve the rakudo release ONCE. `install-raku.sh` otherwise picks "the
      # newest prebuilt right now", which for a multi-hour sweep can differ
      # between the first shard and the last -- a moving denominator inside one
      # measurement.
      - name: Resolve the rakudo release to pin
        id: raku
        env:
          RAKU_VERSION: ${{ inputs.raku_version }}
        run: |
          set -euo pipefail
          if [ -n "$RAKU_VERSION" ]; then
            url=$(.agents/skills/install-raku/install-raku.sh --print-url --version "$RAKU_VERSION")
          else
            url=$(.agents/skills/install-raku/install-raku.sh --print-url)
          fi
          version=$(printf '%s\n' "$url" | sed -nE 's#.*/rakudo-moar-([0-9]{4}\.[0-9]+(\.[0-9]+)?)-.*#\1#p')
          if [ -z "$version" ]; then
            echo "::error::could not read a rakudo version out of $url"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pinned rakudo $version ($url)"

      - name: Summary
        env:
          SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          {
            echo "## Ecosystem sweep plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| scope | \`$SCOPE\` |"
            echo "| shard jobs | ${{ steps.plan.outputs.count }} |"
            echo "| mutsu | \`${{ steps.plan.outputs.mutsu-commit }}\` |"
            echo "| rakudo | ${{ steps.raku.outputs.version }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  sweep:
    needs: build
    runs-on: ubuntu-24.04
    # A shard of the corpus can legitimately run for hours (its own suites, on
    # both interpreters, with retries). Well under the 6h job ceiling, which is
    # why the corpus fans out across 27 jobs instead of running as one.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Hosted-runner concurrency is shared with CI on every open PR. 8 keeps a
      # full sweep from starving the thing that gates merges.
      max-parallel: 8
      matrix:
        chunk: ${{ fromJSON(needs.build.outputs.chunks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the mutsu binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutsu-release-binary
          path: target/release

      # Into the cache `ecosystem_common.load_index()` reads, so this shard
      # resolves versions from the same index snapshot as every other shard.
      - name: Download the pinned index
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecosystem-index
          path: /tmp/eco-index

      # The path matters: bundled batteries (the vendored Test.rakumod among
      # them) are found relative to the executable, `target/<profile>/../../modules`.
      # Artifacts do not carry the executable bit.
      - name: Restore the binary layout and the index cache
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/mutsu-ecosystem"
          cp -a /tmp/eco-index "$HOME/.cache/mutsu-ecosystem/index"
          chmod +x target/release/mutsu
          target/release/mutsu --version
          target/release/mutsu -e 'use Test; plan 1; is MONKEY-SEE-NO-EVAL(), 1, "vendored Test"'

      # The records the sweep compares against (`--stale`, `--status`) and
      # rewrites. /tmp/ledger is a git checkout of `ecosystem-data`, so the
      # staging step below can ask git which records this shard changed.
      - name: Check out the ledger
        run: scripts/ecosystem-ledger.sh worktree /tmp/ledger

      # See ci.yml's "Use canonical apt mirror": the default runner mirror
      # (azure.archive.ubuntu.com) has been observed hanging indefinitely.
      - name: Use canonical apt mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list 2>/dev/null || true

      # Loading a distribution runs its BEGIN phasers; running its suite runs
      # arbitrary unaudited code. The sweep refuses a corpus without bwrap and
      # so does this job -- there is no unsandboxed fallback, deliberately.
      - name: Install and verify the sandbox
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          probe() { bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc \
                      --die-with-parent true; }
          if ! probe; then
            # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor,
            # which is exactly what --unshare-all needs. The runner gives us
            # sudo, so lift it rather than dropping the sandbox.
            echo "bwrap probe failed; relaxing kernel.apparmor_restrict_unprivileged_userns"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            probe || { echo "::error::bwrap does not work on this runner; refusing to measure unsandboxed"; exit 1; }
          fi
          echo "bwrap ok: $(bwrap --version)"

      - name: Install the pinned rakudo
        env:
          RAKU_VERSION: ${{ needs.build.outputs.raku-version }}
        run: |
          set -euo pipefail
          .agents/skills/install-raku/install-raku.sh --version "$RAKU_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Measure
        env:
          SWEEP_ARGS: ${{ matrix.chunk.args }}
          JOBS: ${{ inputs.jobs || '4' }}
          ATTEMPTS: ${{ inputs.attempts || '3' }}
          FILE_TIMEOUT: ${{ inputs.file_timeout || '120' }}
          MUTSU_BIN: target/release/mutsu
        run: |
          set -euo pipefail
          raku --version
          # `measured.host` has to distinguish this from the maintainer's box:
          # both are linux-x86_64, and a history row that mixes them reports one
          # triple for two machines.
          export MUTSU_ECO_HOST="gha-${ImageOS:-ubuntu}-$(nproc)c"
          # $SWEEP_ARGS is word-split on purpose. Every token in it was
          # generated and validated by scripts/ecosystem-ci.py plan.
          # shellcheck disable=SC2086
          scripts/ecosystem-sweep.py $SWEEP_ARGS \
            --jobs "$JOBS" --attempts "$ATTEMPTS" --timeout "$FILE_TIMEOUT"

      # Only the records this shard actually changed. Shards are disjoint by
      # distribution name, so the collect job can merge every artifact into one
      # tree with no conflicts -- and an untouched record is never re-uploaded
      # from a stale checkout on top of a fresher measurement.
      # `always()` on this step and the upload below: records are written per
      # distribution as the sweep goes, so a Measure that dies half way through
      # still produced real measurements. Discarding them is never the right
      # call -- a partial set is exactly what `scope: stale` picks up next time,
      # and the collect job already refuses a history row for an incomplete run.
      - name: Stage the changed records
        id: stage
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/eco-staging
          # The sweep wrote into the working tree's (gitignored) ecosystem/;
          # mirror that into the ledger checkout, where git can diff it.
          scripts/ecosystem-ledger.sh stage /tmp/ledger
          cd /tmp/ledger
          # `-uall` is load-bearing, not tidiness: plain `git status --porcelain`
          # COLLAPSES a wholly-new directory into one entry (`?? ecosystem/dists/D/`),
          # and a shard whose letter has never been measured creates exactly that.
          # `cp --parents` then refuses the directory and the whole shard's
          # measurement is lost -- which is precisely what happened to the first
          # real run (`cp: -r not specified; omitting directory
          # 'ecosystem/dists/D/'`, 128 distributions thrown away after 26 minutes).
          # `-z` plus the 3-character status prefix keeps a path with a space or a
          # non-ASCII character intact, which `awk '{print $NF}'` and git's default
          # path quoting would each mangle.
          git -c core.quotePath=false status --porcelain -uall -z -- ecosystem \
            | tr '\0' '\n' | sed -n 's/^.\{3\}//p' | sort -u > /tmp/eco-changed.txt
          count=$(grep -c . /tmp/eco-changed.txt || true)
          staged=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            # actions/upload-artifact rejects these (NTFS cannot hold them) and
            # fails the ENTIRE artifact over one path -- which is how shards A
            # and S lost every record they had measured. The filenames are
            # escaped at the source now (ecosystem_common.record_filename), so
            # this is the belt: one unexpected path costs one record.
            case "$path" in
              *:*|*'"'*|*'<'*|*'>'*|*'|'*|*'*'*|*'?'*)
                echo "::warning title=record name rejected by artifact upload::$path"
                continue ;;
            esac
            # Tolerant on purpose: one unexpected path must cost one record, not
            # the whole shard. `set -e` here is what turned a single bad `cp`
            # into 128 discarded measurements.
            if cp --parents "$path" /tmp/eco-staging/ 2>/dev/null; then
              staged=$((staged + 1))
            else
              echo "::warning title=could not stage a record::$path"
            fi
          done < /tmp/eco-changed.txt
          echo "changed=$staged" >> "$GITHUB_OUTPUT"
          if [ "$staged" != "$count" ]; then
            echo "::warning title=staged fewer than changed::$staged of $count"
          fi
          echo "shard ${{ matrix.chunk.id }}: staged $staged of $count changed record file(s)"

      - name: Upload the records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eco-records-${{ matrix.chunk.id }}
          path: /tmp/eco-staging
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "- shard \`${{ matrix.chunk.id }}\` (\`${{ matrix.chunk.args }}\`): ${{ steps.stage.outputs.changed || 0 }} record(s) changed" >> "$GITHUB_STEP_SUMMARY"

  # Merge every shard's records into one tree, roll the numbers up, and land it.
  # Runs even when a shard failed: 26 measured shards are worth landing, and the
  # failed one is simply re-dispatched (`scope: stale` picks up exactly what is
  # still at an older commit).
  collect:
    needs: [build, sweep]
    if: >-
      always() && needs.build.result == 'success'
      && needs.sweep.result != 'cancelled' && needs.sweep.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The only job that writes: one commit to `ecosystem-data` (or to an
    # `ecosystem/hold-*` branch), with the default GITHUB_TOKEN. No pull
    # request, so no CI run to start and no secret beyond that token next to a
    # job that handles third-party test output. `ecosystem-data` is not `main`:
    # main's ruleset does not cover it, exactly like `bench-data`.
    permissions:
      contents: write
    steps:
      # `ref: main` deliberately, not the dispatch-time commit: a corpus sweep
      # runs for over an hour and main moves under it, so the scripts and the
      # hand-maintained inputs (exclude list, accepted divergences) are main's
      # as of NOW. `fetch-depth: 0` is what lets `ecosystem-ci.py apply` order
      # two mutsu commits with `merge-base`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] -- this job pushes the ledger branch with the persisted token
        with:
          ref: main
          fetch-depth: 0

      # A worktree of the same repository, so it shares the persisted token the
      # push below needs. The ledger's tip is fetched now, after the shards
      # finished, so "the base" that `apply` compares against is the newest one.
      - name: Check out the ledger
        run: scripts/ecosystem-ledger.sh worktree /tmp/ledger

      # A sweep whose every verdict matched what is already on the ledger
      # uploads no artifact at all (`if-no-files-found: ignore`), which is a real
      # and expected outcome -- "the numbers did not move" -- not a download
      # failure. The next step counts what actually arrived.
      - name: Download every shard's records
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: eco-records-*
          merge-multiple: true
          path: /tmp/incoming

      # Not `cp -a`: a record the ledger already holds at a NEWER mutsu commit
      # must survive. Sweeps are serialized, but a hand-pushed local measurement
      # or a fast-forwarded `ecosystem/hold-*` branch can put one there, and
      # copying this sweep's older measurement over it would silently re-open a
      # record that is already green. The rule and its git-backed ordering are in
      # scripts/ecosystem-ci.py, under --self-test.
      - name: Apply them to the tree
        id: apply
        run: |
          set -euo pipefail
          if [ -d /tmp/incoming ] && [ -n "$(find /tmp/incoming -type f -print -quit)" ]; then
            python3 scripts/ecosystem-ci.py apply --source /tmp/incoming --repo .
          fi
          scripts/ecosystem-ledger.sh stage /tmp/ledger
          # Same `-uall` requirement as the shards' staging step: a new shard
          # directory would otherwise arrive as a single directory entry, which
          # the `.json` filter in the provenance step drops -- leaving the
          # records unattributed and silently vetoing the history row.
          git -C /tmp/ledger -c core.quotePath=false status --porcelain -uall -z -- ecosystem \
            | tr '\0' '\n' | sed -n 's/^.\{3\}//p' | sort -u > /tmp/changed.txt
          count=$(grep -c . /tmp/changed.txt || true)
          echo "changed=$count" >> "$GITHUB_OUTPUT"
          echo "$count record file(s) differ from the ledger"

      - name: Check the provenance
        id: provenance
        if: steps.apply.outputs.changed != '0'
        run: |
          set -euo pipefail
          # Only the per-distribution records carry a `measured` block;
          # index-snapshot.json and the generated summaries do not, and feeding
          # them in would read as an unreadable record and veto the history row.
          # The paths are read from the working tree's ecosystem/, which `stage`
          # just mirrored into the ledger checkout byte for byte.
          grep -E '^ecosystem/dists/.*\.json$' /tmp/changed.txt > /tmp/records.txt || true
          python3 scripts/ecosystem-ci.py provenance --markdown /tmp/provenance.md < /tmp/records.txt

      # `--history` is the one thing a partial or mixed run may not do: a
      # history row reports a single (mutsu commit, rakudo, host) triple and a
      # single corpus-wide rate, so appending one for a subset -- or for a run
      # whose shards disagree about what measured them -- puts a point on the
      # KPI chart that is not comparable with its neighbours.
      - name: Roll the numbers up
        id: rollup
        if: ${{ (inputs.rollup || github.event_name == 'schedule') && steps.apply.outputs.changed != '0' }}
        env:
          FULL_CORPUS: ${{ needs.build.outputs.full-corpus }}
          WANT_HISTORY: ${{ inputs.history || github.event_name == 'schedule' }}
          ALL_SHARDS_OK: ${{ needs.sweep.result == 'success' }}
          UNIFORM: ${{ steps.provenance.outputs.uniform }}
        run: |
          set -euo pipefail
          # The ledger deliberately carries no summary until a full corpus
          # sweep has produced one: a rollup over a partial ledger reports a
          # rate that reads as the ecosystem KPI and is not one
          # (ecosystem/README.md). Refreshing a summary that already exists is
          # fine -- creating the first one from a subset is not.
          #
          # `scope=all` alone does not prove a corpus was measured: run 4 asked
          # for all 27 shards and two of them lost every record they had
          # measured, so the first summary was created over 1423 of 1624
          # distributions. Completeness is the same condition `--history` uses
          # below, so require it here too for the FIRST summary.
          if [ ! -f ecosystem/summary.json ] \
             && { [ "$FULL_CORPUS" != "true" ] || [ "$ALL_SHARDS_OK" != "true" ]; }; then
            echo "::notice title=no rollup::this would create the first ecosystem/summary.json from an incomplete sweep; run scope=all with every shard green for that"
            echo "appended-history=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          history=""
          if [ "$WANT_HISTORY" = "true" ]; then
            if [ "$FULL_CORPUS" != "true" ]; then
              echo "::warning title=no history row::--history needs scope=all; this run measured a subset"
            elif [ "$ALL_SHARDS_OK" != "true" ]; then
              echo "::warning title=no history row::a shard failed, so this is not a complete corpus sweep"
            elif [ "$UNIFORM" != "true" ]; then
              echo "::warning title=no history row::records disagree about what measured them"
            else
              history="--history"
            fi
          fi
          echo "appended-history=$([ -n "$history" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2086
          scripts/ecosystem-sweep.py --rollup $history

      - name: Write the report
        id: report
        run: |
          set -euo pipefail
          {
            echo "## Ecosystem sweep"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| scope | \`${{ inputs.scope || 'all' }}\` (${{ github.event_name }}) |"
            echo "| mutsu | \`${{ needs.build.outputs.mutsu-commit }}\` |"
            echo "| rakudo | ${{ needs.build.outputs.raku-version }} |"
            echo "| shards | ${{ needs.build.outputs.count }} (\`${{ needs.sweep.result }}\`) |"
            echo "| records changed | ${{ steps.apply.outputs.changed }} |"
            if [ "${{ steps.apply.outputs.superseded || 0 }}" != "0" ]; then
              echo "| records left alone (the ledger measured them later) | ${{ steps.apply.outputs.superseded }} |"
            fi
            # These are rates over the WHOLE ledger, not over this run's slice:
            # that is what the published KPI is, and a per-run rate over a
            # hand-picked subset is not one.
            if [ -f ecosystem/summary.json ]; then
              for metric in dist_parity file_parity assertion_parity; do
                value=$(python3 -c "import json,sys;print(json.load(open('ecosystem/summary.json'))[sys.argv[1]])" "$metric")
                echo "| $metric (whole ledger) | ${value}% |"
              done
              echo "| distributions in the ledger | $(python3 -c "import json;print(json.load(open('ecosystem/summary.json'))['distributions'])") |"
            fi
            echo "| history row appended | ${{ steps.rollup.outputs.appended-history || 'false' }} |"
            echo ""
            if [ -f /tmp/provenance.md ]; then
              echo "### Provenance"
              echo ""
              cat /tmp/provenance.md
              echo ""
            fi
            echo "Measured by ecosystem-sweep.yml, run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }},"
            echo "on a hosted runner, so \`measured.host\` reads \`gha-*\`. Method: docs/ecosystem-parity.md;"
            echo "decisions: docs/adr/0085-ecosystem-testsuite-parity-measurement.md."
          } > /tmp/report.md
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      # One commit on top of the ledger; the report is its message body.
      #
      #   publish=land   -> ecosystem-data                        (the ledger)
      #   publish=branch -> ecosystem/hold-<date>-<run>, on top of it (left for a human)
      #
      # A sweep dispatched from a feature ref measured that ref's mutsu, not
      # main's, so it is always pushed as a `hold-` branch. A human lands one
      # with `git push origin <hold-branch>:ecosystem-data` (a fast-forward while
      # the ledger has not moved since).
      #
      # A rejected push is NOT rebased and retried: `apply` decided "newer
      # measurement wins" against the ledger tip it saw, so a ledger that moved
      # under this run needs that decision made again. Sweeps are serialized by
      # the concurrency group, so only a hand push can cause it; re-dispatch
      # with `scope: stale`, which measures again exactly what is still old.
      - name: Push to the ledger
        if: ${{ (inputs.publish || 'land') != 'none' && steps.apply.outputs.changed != '0' }}
        env:
          PUBLISH: ${{ inputs.publish || 'land' }}
          SCOPE: ${{ inputs.scope || 'all' }}
          MUTSU_COMMIT: ${{ needs.build.outputs.mutsu-commit }}
          RAKU_VERSION: ${{ needs.build.outputs.raku-version }}
        run: |
          set -euo pipefail
          target=ecosystem-data
          if [ "$PUBLISH" != "land" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            target="ecosystem/hold-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          fi
          # The rollup rewrote the summaries after the apply step's stage.
          scripts/ecosystem-ledger.sh stage /tmp/ledger
          cd /tmp/ledger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ecosystem/
          {
            echo "ecosystem: refresh parity records (scope=${SCOPE})"
            echo ""
            echo "mutsu ${MUTSU_COMMIT}, rakudo ${RAKU_VERSION}."
            echo ""
            cat /tmp/report.md
          } > /tmp/commit-message.txt
          git commit -q -F /tmp/commit-message.txt
          pushed=false
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/$target"; then
              pushed=true
              break
            fi
            echo "push failed, retrying ($attempt)"
            sleep $((attempt * 4))
          done
          if [ "$pushed" != true ]; then
            echo "::error title=ledger not updated::could not push to $target; if the ledger moved during this run, re-dispatch with scope=stale"
            exit 1
          fi
          echo "Pushed \`$(git rev-parse --short HEAD)\` to \`$target\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing changed
        if: steps.apply.outputs.changed == '0'
        run: echo "No record changed — every selected distribution measured identically to what is on the ledger." >> "$GITHUB_STEP_SUMMARY"
