name: Release

on:
  push:
    tags:
      - 'v*'
  # Allow a manual build+package smoke test (all matrix targets, incl. macOS)
  # without cutting a tag. The publish job below is gated on a tag ref, so a
  # workflow_dispatch run uploads artifacts but does NOT create a release.
  workflow_dispatch:

# Read-only by default; only the `release` job below writes (the GitHub
# Release and its provenance attestation).
permissions:
  contents: read

jobs:
  # A `v*` tag is pushed by hand (the `cut-release` skill), not by a bot, so
  # check it is one this repository meant to release before anything is built
  # or published: it must name exactly the version `Cargo.toml` carries at the
  # tagged commit, and that commit must already be on `main` (the version-bump
  # pull request merged and passed CI there). A mistyped or stray tag stops
  # here. A workflow_dispatch smoke build has no tag and skips the check.
  verify-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The tag matches Cargo.toml and is on main
        if: ${{ github.ref_type == 'tag' }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${REF_NAME#v}"
          have=$(sed -n -E '0,/^version = "(.*)"$/ s//\1/p' Cargo.toml)
          if [ "$want" != "$have" ]; then
            echo "::error::tag $REF_NAME does not match Cargo.toml version $have at the tagged commit"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $REF_NAME points at a commit that is not on main; tag the merged version-bump commit"
            exit 1
          fi
          echo "tag $REF_NAME: Cargo.toml $have, commit $(git rev-parse --short HEAD) is on main"

  build:
    needs: verify-tag
    strategy:
      # Do not let one platform's failure cancel the others, so a red target
      # still lets the healthy tarballs upload for inspection.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive_name: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive_name: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-26
            archive_name: macos-x64
          - target: aarch64-apple-darwin
            os: macos-26
            archive_name: macos-arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # All four targets are required. macOS arm64 was `continue-on-error` while
    # the vendored libffi 3.4.x could not assemble under Apple Clang 16/17+
    # (Mach-O CFI, upstream libffi #852). The vendored-libffi bump (ADR-0012)
    # fixed it — verified green by workflow_dispatch run 29672036475 on all four
    # targets — so the safety net is removed: a macOS regression now fails the
    # release loudly instead of silently dropping binaries (which is how every
    # Release since v0.3.1 shipped no macOS tarballs).
    continue-on-error: ${{ matrix.optional || false }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: ${{ matrix.target }}

      # rust-cache restores the registry + built dependencies instead of the
      # whole multi-GB target/, which is faster and far more reliable than the
      # raw actions/cache (which frequently overran the cache-size limit and
      # missed). `shared-key` is the target triple so each matrix leg keeps its
      # own cache (the four targets produce incompatible artifacts).
      # A tag run can restore only caches saved by `main` (pull-request caches
      # are scoped to their own ref), and `main` runs only reviewed, merged
      # code, so restoring here is accepted for the build-time saving.
      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          shared-key: ${{ matrix.target }}

      # Build both shipped binaries: the interpreter (`mutsu`) and the package
      # manager shim (`mzef`).
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --bin mutsu --bin mzef

      # Assemble the distribution tree so an unpacked release is self-contained
      # and `mzef` finds the bundled zef with no configuration. `bin/` and
      # `share/` sit at the archive ROOT (no wrapping version directory) so
      # mise's github-backend autodetection finds `bin/` with zero config:
      #
      #   bin/mutsu
      #   bin/mzef
      #   share/mutsu/zef/...       <- mzef resolves this via ../share/mutsu/zef
      #   share/mutsu/modules/...   <- bundled batteries; mutsu resolves them via
      #                                ../share/mutsu/modules (zero-config `use`)
      #   LICENSE                   <- Artistic-2.0, shipped with every binary
      #                                distribution (license section 2)
      #
      # mise extracts the whole archive into the tool's install dir and exposes
      # `bin/` on PATH, so both commands work after `mise use`.
      - name: Package
        env:
          REF_NAME: ${{ github.ref_name }}
          ARCHIVE_NAME: ${{ matrix.archive_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          pkg="mutsu-${REF_NAME}-${ARCHIVE_NAME}"
          stage="staging/$pkg"
          mkdir -p "$stage/bin" "$stage/share/mutsu"
          cp "target/${TARGET}/release/mutsu" "$stage/bin/"
          cp "target/${TARGET}/release/mzef" "$stage/bin/"
          cp -R vendor/zef "$stage/share/mutsu/zef"
          cp -R modules "$stage/share/mutsu/modules"
          cp LICENSE "$stage/LICENSE"
          tar -C "$stage" -czf "$pkg.tar.gz" bin share LICENSE
          echo "Packaged $pkg.tar.gz:"
          tar tzf "$pkg.tar.gz" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutsu-${{ matrix.archive_name }}
          path: mutsu-${{ github.ref_name }}-${{ matrix.archive_name }}.tar.gz

  # Release-time gate: every bundled library's upstream test suite must still
  # pass (at its recorded baseline) against the SHIPPED library + this mutsu.
  # This is the deliberate, thorough check gating a release publish: a release is
  # cut by pushing a `v*` tag (the `cut-release` skill), and a regression here blocks it.
  # See scripts/battery-testsuite.sh, batteries.lock, batteries-whitelist.txt.
  batteries:
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0

      # A tag run can restore only caches saved by `main` (pull-request caches
      # are scoped to their own ref), and `main` runs only reviewed, merged
      # code, so restoring here is accepted for the build-time saving.
      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          shared-key: x86_64-unknown-linux-gnu

      # libssl for the OpenSSL / IO::Socket::SSL
      # batteries' NativeCall at runtime.
      # See .github/workflows/ci.yml's "Use canonical apt mirror" step for why:
      # the default runner apt-mirrors.txt (azure.archive.ubuntu.com first) has
      # been observed hanging indefinitely.
      - name: Use canonical apt mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list 2>/dev/null || true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build release mutsu
        run: cargo build --release --bin mutsu

      # Read-only use of the checkout cache `ci.yml`'s `test-suites` job saves
      # on `main` (see the note there): the pinned commits make a cached
      # checkout identical to a fetch, so a release is not blocked by an
      # upstream host that happens to be down. Anything missing is fetched.
      - name: Restore the battery source cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/battery-src-cache
          key: battery-src-${{ hashFiles('batteries.lock') }}
          restore-keys: battery-src-

      - name: Run bundled-library test suites
        env:
          MUTSU_BIN: target/release/mutsu
          BATTERY_SRC_CACHE: tmp/battery-src-cache
        run: scripts/battery-testsuite.sh

  npm:
    needs: batteries
    runs-on: ubuntu-24.04
    if: ${{ github.ref_type == 'tag' }}
    # npm trusted publishing is bound to this environment, which only `v*`
    # tags (and `main`) may deploy to.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: .github/scripts/install-wasm-pack.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Build npm package
        run: scripts/build-npm-package.sh

      - name: Verify package contents
        run: npm pack --dry-run ./pkg

      - name: Publish npm package
        run: npm publish --access public ./pkg

  release:
    needs: [build, batteries, npm]
    runs-on: ubuntu-24.04
    # Only publish a GitHub Release for a real tag push. workflow_dispatch runs
    # stop after build (artifacts are available for inspection, no release).
    if: ${{ github.ref_type == 'tag' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      # Publish SHA256 checksums alongside the tarballs so downloaders (and the
      # mise github/ubi backend) can verify the binaries.
      - name: Generate checksums
        env:
          REF_NAME: ${{ github.ref_name }}
        run: sha256sum mutsu-*.tar.gz > "mutsu-${REF_NAME}-SHA256SUMS.txt"

      # Signed SLSA build provenance for every tarball: the SHA256SUMS file is
      # produced by the same job, so it proves integrity in transit only; the
      # attestation also proves which workflow run and commit built each file.
      # Verify with `gh attestation verify <tarball> -R tokuhirom/mutsu`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mutsu-*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            mutsu-*.tar.gz
            mutsu-${{ github.ref_name }}-SHA256SUMS.txt
