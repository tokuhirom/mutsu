    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUTSU_JIT: "on"
      MUTSU_JIT_THRESHOLD: "2"
      # Absolute, so every mutsu in the process tree reports to the one place
      # the crash-report step collects.
      MUTSU_CRASH_DIR: ${{ github.workspace }}/tmp/crash
      # Link with mold (installed below); shared with the other native jobs.
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      # The "ci-linux" dependency cache, shared with the other two jobs that
      # compile a debug build — see the `build` job for why the release build
      # keeps a separate key.
      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "ci-linux"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Link with mold instead of GNU ld — see the `build` job for why it comes
      # from its own release tarball rather than from apt.
      - name: Install mold
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        with:
          mold-version: '2.42.0'
          make-default: false

      # A guard, not an install — see the `test-suites` job for the reasoning,
      # and for why the apt mirror pin sits inside the fallback branch.
      - name: Ensure prove is available
        run: |
          if ! command -v prove >/dev/null; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
            fi
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list 2>/dev/null || true
            sudo apt-get update && sudo apt-get install -y perl
          fi
          prove --version | head -1

      - name: Build (debug, for TAP tests)
        run: cargo build

      - name: TAP tests (prove t/, JIT on)
        # `-j4`, matching the roast step below, the `test` job's TAP step and
        # the ubuntu-latest core count. This suite ran fully SERIAL here until
        # 2026-09-11 and that, not the debug binary, was the dominant cost of
        # the job: the `test` job runs the same 3997 files at `-j4` in 1m28s
        # against 15m53s (gc-stress) / 18m42s (jit-stress) serial, a 10.8x /
        # 12.7x gap of which a debug build explains only ~3x. Both jobs were
        # habitually spending ~90% of `timeout-minutes: 30` as a result, so a
        # single slow `apt` step cancelled them with every test green (#7956).
        #
        # Nothing is lost by parallelising. `MUTSU_GC` / `MUTSU_JIT` and their
        # knobs are per-process runtime settings read by each `mutsu` prove
        # spawns, so each file is exercised under exactly the configuration
        # this job exists to test, whether four of them run at once or one
        # does. `--merge` keeps each file's stderr attached to its own test
        # under interleaved `-j` output, same reasoning as the roast step.
        #
        # `MUTSU_T_TIMEOUT` 60 -> 90: the per-file budget now has to cover CPU
        # contention from three sibling test processes on top of the debug
        # binary, where before it covered the debug binary alone. Headroom on
        # a budget that only ever fires for the heaviest file is free; a
        # timeout that fires because the runner was busy is not (see
        # docs/flaky-test-policy.md 3, which prefers widening the budget to
        # quarantining a slow-but-correct test).
        run: |
          set -o pipefail
          mkdir -p tmp
          prove -r -j4 --merge -e 'scripts/run-t-test.sh' t/ 2>&1 | tee tmp/jit-stress-t.log
        env:
          MUTSU_BIN: target/debug/mutsu
          MUTSU_T_TIMEOUT: "90"

      - name: Flaky quarantine retries used (JIT on)
        if: always()
        run: scripts/report-flaky-retries.sh

      - name: Crash reports (fatal signals, JIT on)
        # `always()`, not `failure()` -- see the "Crash reports (fatal
        # signals)" step above for why (todo/deep/procasync-stress-segv.md).
        if: always()
        run: scripts/report-crash-reports.sh

      - name: Upload JIT stress TAP crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-stress-tap-crash-reports
          path: tmp/crash/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload JIT stress TAP log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-stress-tap-log
          path: tmp/jit-stress-t.log
          retention-days: 7
          if-no-files-found: ignore

  # ── `jit-stress`, second half: the roast whitelist with the JIT forced hot ─
  #
  # Same JIT configuration as `jit-stress-tap` (see the comment there); this
  # half runs the roast whitelist on the shared release binary and compiles
