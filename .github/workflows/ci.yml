name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# One in-flight CI run per ref. A PR that gets several pushes in a row (a
# fixup, a rebase, a force-push) used to leave every superseded run grinding
# through the full ~25 min roast suite for a commit nobody will merge, which is
# pure runner-slot waste on a repo that lands many small PRs per hour. Cancel
# those; never cancel a `push: main` run (its result is the post-merge safety
# net and is what the bench/history tooling reads).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── The shape of this workflow ──────────────────────────────────────────────
#
# `changes` classifies the diff, `build` compiles the release binary ONCE, and
# every job that only *runs* the interpreter downloads that binary instead of
# compiling its own. The three heavyweight units are each split into the half
# that needs a compiler and the half that needs a suite, so a red check names
# what broke instead of pointing at fifteen minutes of unrelated work:
#
#   build ──┬─> test-suites ─────┬─> test        (required)
#           │   test-check ──────┘
#           ├─> gc-stress-roast ─┬─> gc-stress   (required)
#           │   gc-stress-tap ───┘
#           └─> jit-stress-roast ┬─> jit-stress
#               jit-stress-tap ──┘
#
# `test`, `gc-stress` and `jit-stress` are AGGREGATORS: they run no tests and
# exist for their NAMES. Branch protection's required status checks are job
# names (`test`, `wasm-e2e`, `gc-stress`), and a required check that is never
# created does not fail the PR -- it leaves it pending forever, unmergeable,
# with no error anywhere. So the halves take new names and the required names
# stay put, which needs no branch-protection change. If you split, rename or
# remove a job here, check its name against branch protection FIRST, and
# verify on the PR itself that the required checks still appear.
#
# Each aggregator runs `if: always()` and fails unless every job it depends on
# reports `success` -- including `build`, so a build failure cannot reach the
# required check as an innocent-looking `skipped`. The one case where skipping
# is success is a documentation-only change, and the aggregator recognises that
# from the `changes` output rather than inferring it from a skip.

jobs:
  # Classifies the change as documentation-only so the build jobs below
  # can skip themselves. Roughly one commit in six touches only prose and
  # records -- docs/, news/, TODO_roast/, .agents/, ecosystem/, a top-level
  # *.md -- and each one was paying for two full cargo builds plus three roast
  # sweeps. scripts/ci-docs-only.sh holds the allowlist and the reasoning for
  # every entry on it.
  #
  # This must be a job-level `if:`, not a workflow-level `paths-ignore`. With
  # `paths-ignore` GitHub never creates the check run, so the required status
  # checks (`test`, `wasm-e2e`, `gc-stress`) stay pending and the PR can never
  # merge. A job that exists and is *skipped* counts as success for branch
  # protection, which is exactly the semantics we want.
  #
  # The classifier is an allowlist and fails safe: anything it does not
  # recognise as documentation -- including this file, which defines the very
  # jobs a skip would skip -- yields `false` and runs everything. It self-tests
  # on each run (~1s) so a bad edit to the path rules is caught here rather
  # than by a silently-untested merge.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.detect.outputs.docs-only }}
      gc-value: ${{ steps.detect.outputs.gc-value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Makefile and this workflow are what `--check-inputs` below
          # reads: they name every path the build consumes, and no such path
          # may be on the classifier's documentation allowlist. Leading slashes
          # anchor each pattern to the repository root -- a bare `Makefile` in
          # non-cone mode would also drag in every vendored one.
          sparse-checkout: |
            /scripts/ci-docs-only.sh
            /Makefile
            /.github/workflows/ci.yml
          sparse-checkout-cone-mode: false

      - name: Classifier self-test
        run: scripts/ci-docs-only.sh --self-test

      - name: No build input is classified as documentation
        # The allowlist is a claim that no job below reads these paths, and it
        # would rot silently: wiring a `scripts/*.py` into `make test` would
        # quietly turn an untested change into a "documentation" one. This
        # derives the claim from the Makefile and this file instead of trusting
        # it. Separate from --self-test so an incomplete sparse-checkout above
        # fails here rather than skipping the guard.
        run: scripts/ci-docs-only.sh --check-inputs

      - name: Detect documentation-only change
        id: detect
        run: |
          result=$(scripts/ci-docs-only.sh)
          echo "docs-only=$result" >> "$GITHUB_OUTPUT"
          echo "docs-only=$result"
          # Second, independent question for the `miri` job below: does this
          # change touch the GC / container-value code whose aliased-write
          # soundness ADR-0013 pins? Same script, opposite fail-safe default.
          gc=$(scripts/ci-docs-only.sh --gc-value)
          echo "gc-value=$gc" >> "$GITHUB_OUTPUT"
          echo "gc-value=$gc"
        env:
          GH_TOKEN: ${{ github.token }}
          # GITHUB_EVENT_NAME / GITHUB_SHA / GITHUB_REPOSITORY come from the
          # runner; these two do not.
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # ── The one release build the rest of the workflow shares ────────────────
  #
  # `cargo build --release` used to run three times on the same commit — in
  # `test`, in `gc-stress` and in `jit-stress` — producing a byte-identical
  # binary each time, because MUTSU_GC and MUTSU_JIT are runtime environment
  # variables, not cargo features. (That is the same fact that already lets
  # those jobs share one rust-cache key.) Measured on run 34582469117 that was
  # 4m05s + 3m04s + 4m20s = 11m29s of runner time per CI run buying nothing.
  #
  # Build it once here and hand it to the consumers as an artifact, the way
  # ecosystem-sweep.yml already builds one binary for its 27 shards. The
  # consumers — `test-suites`, `gc-stress-roast`, `jit-stress-roast` — then
  # need no toolchain, no cargo cache and no linker at all, which is why they
  # start with a bare checkout.
  #
  # The jobs that still compile something of their own (`test-check` and the
  # two TAP halves, which need a DEBUG binary and the debug_assert!s in it) do
  # NOT wait for this job: they run alongside it.
  build:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      # Swatinem/rust-cache keys on the lockfile + rustc + flags and caches the
      # registry and the built dependencies (pruning the workspace crate so the
      # cache stays small and restores fast), which is far more reliable than
      # stuffing the whole multi-GB `target/` into actions/cache. `shared-key`
      # is what lets jobs share one entry instead of each keeping its own.
      #
      # This job owns the RELEASE key and the debug-compiling jobs
      # (`test-check`, `gc-stress-tap`, `jit-stress-tap`) share "ci-linux"
      # between them. Two keys, not one, because rust-cache caches whatever
      # dependency artifacts `target/` happens to hold: while every job built
      # both profiles, one entry held both, but this job now builds only
      # release and those three only debug. On a single shared key the save
      # would be a race whose winner decides which profile everyone else has
      # to recompile from scratch on every run. GC/JIT are still runtime env
      # vars rather than cargo features, so the three debug jobs do compile
      # byte-identical artifacts and one key genuinely serves them.
      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "ci-linux-release"
          # Only PRs restore; only main pushes save. This keeps the cache warm
          # from main without every PR writing its own entry and evicting others.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # mold comes from its own release tarball, NOT from apt. `apt-get
      # update` was the only reason this job touched apt at all, and it is the
      # most variable step in the workflow: 22s on a good day, 2m54s on a bad
      # one -- enough on its own to push gc-stress past `timeout-minutes` with
      # every test green (#7956) -- and it has a documented history of hanging
      # indefinitely on the runner's default mirror list until the job timeout
      # cancels it (2026-08-19, PRs #6684 #6691), with zero relation to the
      # PR's diff.
      #
      # Nothing else in this job needs a package. The runner image already
      # ships `perl` (a `dpkg-dev` dependency; `prove` comes with
      # `perl-modules`) and `libssl-dev` (both in toolset-2404's
      # `apt.common_packages`), so `mold` was the single genuinely missing
      # package -- and it is a 6 MB tarball from its own GitHub release, which
      # the action below is a three-line `wget` around. rui314 is mold's
      # author; the action is pinned by SHA like every other action here.
      #
      # `make-default: false`: do not symlink /usr/bin/ld to mold. Every cargo
      # invocation in this job already selects mold explicitly through
      # RUSTFLAGS, so swapping the system linker for every `cc` in the job
      # would widen the blast radius for nothing. `-fuse-ld=mold` finds
      # `/usr/local/bin/ld.mold` on PATH.
      - name: Install mold
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        with:
          mold-version: '2.42.0'
          make-default: false

      - name: Build (release)
        # The repo sets `[profile.release] debug = true` for local perf
        # profiling. CI never profiles, and full debug info bloats the binary
        # (~250MB -> ~27MB) and slows codegen/linking by ~70s. Override it to
        # off for CI only; Cargo.toml stays debug=true for local use. It also
        # keeps the artifact small enough that upload + download costs seconds
        # against the ~4 minutes a rebuild costs.
        #
        # This one binary serves `prove t/`, all three roast sweeps and the
        # bundled-library gate. The TAP suite used to run on a separate debug
        # build; on release it is ~3.3x faster (ADR-0075).
        run: cargo build --release
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "false"

      - name: Upload the release binary
        # One day of retention: this is a build cache between jobs of one run,
        # not a published artifact. `if-no-files-found: error` so a build that
        # somehow produced nothing fails here instead of handing every consumer
        # a missing-binary failure to diagnose.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutsu-release-binary
          path: target/release/mutsu
          retention-days: 1
          if-no-files-found: error

  # ── `test`, first half: everything that needs a COMPILER but no suite ────
  #
  # fmt, clippy, the unit tests, the language-server crate and the cheap ledger
  # validators. None of them touches the release binary, so this half does not
  # wait for the `build` job; it runs in parallel with it and reports its own
  # red check when a lint or a unit test is what broke.
  #
  # `cargo test` also leaves a DEBUG binary at target/debug/mutsu as a side
  # effect; nothing here depends on that, but see the note on the site-snippets
  # step in `test-suites`, which used to.
  #
  # Skipped on a documentation-only change — see the `changes` job.
  test-check:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    # Clippy with `--all-targets` on a cold cargo cache is the long pole here.
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The four ledger checks run FIRST, before any toolchain: they read
      # files and finish in about a second each, so an unsorted whitelist or an
      # expired quarantine entry should not have to wait out a clippy pass.
      - name: Roast whitelist is sorted
        run: make check-roast-whitelist

      - name: t/ layout is valid
        # Categories, depth cap and globally-unique basenames, per
        # docs/t-directory-layout.md.
        run: make check-t-layout

      - name: Flaky quarantine ledger is valid and unexpired
        # Fails when an entry in flaky-tests.txt is past its review date, so a
        # quarantine cannot quietly become permanent. See
        # docs/flaky-test-policy.md §5.
        run: make check-flaky-list

      - name: Hand-built __mutsu_* env keys did not grow
        # A ratchet, not a ban: the per-file count of
        # `format!("__mutsu_...::{name}")` sites may go down but never up. Build
        # them with `MetaNs` instead, which memoizes the key. This pattern has
        # been the profiling finding in five separate perf campaigns (#8087).
        run: make check-magic-keys

      - name: Panic-family / #[allow( surface did not grow
        # A ratchet, not a ban: PLAN.md's "mutsu must never Rust-panic on any
        # input" had no enforcement, and the count of
        # unwrap/expect/panic!/unreachable!/todo!/unimplemented! (and of
        # #[allow() sites) rose at every architecture review. Both counts may
        # go down but never up (#8186). scripts/check-panic-surface.py
        # excludes #[cfg(test)] scaffolding by scanning comments/strings/braces
        # itself rather than a plain grep, so `make check-panic-surface` runs
        # its own `--self-test` against synthetic snippets first -- a bug in
        # the masker could otherwise make the ratchet silently report 0 no
        # matter what src/ contains.
        run: make check-panic-surface

      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          components: clippy, rustfmt

      # The "ci-linux" dependency cache, shared with the other two jobs that
      # compile a debug build — see the `build` job for why the release build
      # keeps a separate key.
      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "ci-linux"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Link with mold instead of GNU ld — see the `build` job for why it comes
      # from its own release tarball rather than from apt.
      - name: Install mold
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        with:
          mold-version: '2.42.0'
          make-default: false

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        # `--all-targets`, not a bare `cargo clippy`: without it the lint only
        # sees the library, so every `#[cfg(test)]` module in `src/`, the
        # `tests/` integration targets and the `mzef` bin are linted by nobody
        # (the mutsu-lsp step below has always passed `--all-targets` for
        # exactly this reason). Nine warnings had accumulated in test code
        # under that blind spot by 2026-09-06.
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        # `--test-threads=1` for the same reason the gc-stress-tap job below
        # serializes: the collector's `COLLECTING` flag is process-global, so a
        # collect on one test thread trips `debug_assert!(!collecting())` inside
        # an unrelated test running concurrently. That produced two red main
        # builds (gc::gc_ptr::tests::arc_and_gc_strong_counts_stay_in_lockstep,
        # runs 30006147778 / 29924949096) on trees that had just passed CI.
        # Costs ~1s. See docs/flaky-test-policy.md §3.
        run: cargo test -- --test-threads=1
        env:
          RUST_MIN_STACK: 8388608

      - name: Language server crate (ADR-0065)
        # The server lives in this repository precisely so a parser change that
        # breaks it fails here rather than silently in a separate repo
        # (ADR-0065 D7). `cargo build`/`cargo test` at the root build only the
        # `mutsu` package (see `default-members` in the root Cargo.toml), so the
        # crate needs its own step. `--all-targets` lints its tests too: the
        # positional assertions are the only thing standing between a wrong
        # range and a consumer that will never report one (D5).
        run: |
          cargo clippy -p mutsu-lsp --all-targets -- -D warnings
          cargo test -p mutsu-lsp


  # ── `test`, second half: the suites, on the shared release binary ────────
  #
  # The TAP suite, the roast whitelist (cold and warm precomp cache) and the
  # bundled-library gate. Every one of them runs the interpreter and none of
  # them compiles it, so this job takes the binary from the `build` job and
  # installs no toolchain, no cargo cache and no linker.
  #
  # Splitting it from `test-check` is not only about the build: a red check
  # named `test-suites` says a program produced the wrong output, where a red
  # `test` said "something in fifteen minutes of unrelated work went wrong".
  #
  # Skipped on a documentation-only change — see the `changes` job.
  test-suites:
    needs: [changes, build]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Absolute, so every mutsu in the process tree reports to the one place
      # the crash-report step collects. See the note on that step below.
      MUTSU_CRASH_DIR: ${{ github.workspace }}/tmp/crash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Download the release binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutsu-release-binary
          path: target/release

      - name: Restore the binary
        # Two things the artifact does not carry, both of which this step puts
        # back. (1) The executable bit: an artifact is a zip, so the downloaded
        # file arrives mode 644 and every `prove -e` below would die with
        # "Permission denied". (2) Its place in the tree: bundled batteries are
        # resolved relative to the executable (`target/<profile>/../../modules`),
        # so the binary has to land back inside the checkout it was built from,
        # which is why the download path above is `target/release` and not a
        # scratch directory. `--version` then proves both at once — a wrong mode
        # or a truncated download fails here, in a two-second step, instead of
        # once per test file for the rest of the job. Same shape as
        # ecosystem-sweep.yml's "Restore the binary layout and the index cache".
        run: |
          set -euo pipefail
          chmod +x target/release/mutsu
          target/release/mutsu --version

      # A guard, not an install: this is expected to be a no-op, and exists so
      # that a future runner image dropping perl degrades to the old apt cost
      # rather than failing every TAP step in the workflow at once. The mirror
      # pin moves in here with the apt call it protects.
      - name: Ensure prove is available
        run: |
          if ! command -v prove >/dev/null; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
            fi
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list 2>/dev/null || true
            sudo apt-get update && sudo apt-get install -y perl
          fi
          prove --version | head -1

      - name: TAP tests (prove t/)
        # Via the wrapper (not a bare `timeout 30 <bin>`) so t/ gets the same
        # per-file timeout + flaky-quarantine handling as roast.
        #
        # `-j4` matches the roast step below (and the ubuntu-latest core
        # count): this suite ran fully serial and took ~6.5 min against
        # roast's ~2.5 min at -j4 despite having 3200+ files vs roast's 246,
        # almost entirely idle-serial overhead. `--merge` folds each test's
        # stderr into its stdout so a panic stays attached to its own test
        # under interleaved `-j` output, same reasoning as the roast step.
        #
        # MUTSU_T_TIMEOUT bumped 30 -> 45: a local repro of that change found
        # t/cro-http-battery.t (Cro::HTTP + Cro::TLS + JSON::JWT, ~5s
        # standalone) occasionally pushed past 30s under -j4 CPU contention
        # from 3300 concurrently-running files, timing out once in a handful
        # of full-suite runs. Per docs/flaky-test-policy.md §3 ("wall-clock
        # sensitivity ... prefer raising the budget ... a precise fix"),
        # widen the budget rather than quarantining a real (if heavy) test.
        # Kept at 45 on the release binary too: the budget exists for the
        # heaviest file under contention, and headroom there is free.
        # `mkdir -p tmp` like the two stress TAP steps and
        # `make test`: two dozen tests write scratch files to a relative
        # `tmp/`, which is gitignored and so absent from a fresh checkout.
        # This step was the only one of the four without it, and got away
        # with it only because the flat t/ ordering happened to run
        # something that created the directory first. Nesting t/ reshuffled
        # the order and six IO/lazy-seq files started dying at `spurt`.
        run: |
          mkdir -p tmp
          prove -r -j4 --merge -e 'scripts/run-t-test.sh' t/
        env:
          MUTSU_BIN: target/release/mutsu
          MUTSU_T_TIMEOUT: "45"

      - name: Site snippets still produce their documented output
        # Every code sample shipped on the site (landing highlights +
        # tutorial lessons) runs under mutsu here and must match the output
        # recorded next to it. `raku` is not installed on the runner, so the
        # raku cross-check is skipped and this is a pure regression gate; the
        # cross-check runs locally when the expectations are regenerated.
        run: node scripts/check-site-snippets.mjs
        env:
          # Explicit, and required now: the script's default is
          # target/debug/mutsu, which this job never builds. It used to work
          # only because the `cargo test` step that now lives in `test-check`
          # left a debug binary behind as a side effect.
          MUTSU_BIN: target/release/mutsu

      - name: Clean precomp cache and restore roast files
        run: |
          rm -rf ~/.cache/mutsu/precomp
          git checkout -- roast/

      - name: Roast tests (make roast)
        # -j4 matches the GitHub ubuntu-latest core count. The roast suite is
        # dominated by sleep/timer-bound S17 concurrency tests that leave the
        # CPU idle; running them in parallel overlaps that idle time with the
        # CPU-bound tests and cuts wall-clock roughly 3x (~7.5min -> ~2.5min).
        # Do not oversubscribe past the core count: the S17 scheduler/promise
        # tests assert on real wall-clock scheduling and flake under CPU
        # starvation.
        #
        # `--state=save` records pass/fail in `.prove` so the failure-summary
        # step below can re-run only the failures, serially and verbosely.
        # `--merge` folds each test's stderr into its stdout so a Rust panic or
        # `expected/got` diagnostic stays attached to its own test under -j
        # instead of scattering across the interleaved parallel output. The full
        # output is tee'd to tmp/roast.log and uploaded as an artifact, because
        # the GitHub web log viewer truncates this long step and hides prove's
        # end-of-run "Test Summary Report" (the clean failed-files list).
        run: |
          set -o pipefail
          mkdir -p tmp
          prove -j4 --state=save --merge -e 'scripts/run-roast-test.sh' \
            $(cat roast-whitelist.txt) 2>&1 | tee tmp/roast.log
        env:
          MUTSU_BIN: target/release/mutsu

      - name: Roast tests (warm precomp cache)
        # The step above deliberately starts from an empty precomp cache, and CI
        # runners are fresh anyway, so until now the *warm* cache path was never
        # exercised here at all — a default-on mechanism the project's
        # comprehensive safety net structurally could not test. A cache hit skips
        # a module's parse, so any parser state the entry fails to replay becomes
        # a bug that only shows up on the second run of a program; that is exactly
        # how the S14-roles/versioning.t language-revision bug reached main.
        #
        # The full run above just warmed the cache for every module the suite
        # loads, so re-running the module-sensitive slice of the whitelist now
        # covers the hit path. Small subset, seconds of wall clock.
        run: |
          set -o pipefail
          prove -j4 --merge -e 'scripts/run-roast-test.sh' \
            $(grep -E '/(S10-packages|S11-modules|S14-roles)/' roast-whitelist.txt)
        env:
          MUTSU_BIN: target/release/mutsu

      - name: Flaky quarantine retries used
        if: always()
        run: scripts/report-flaky-retries.sh

      - name: Roast failure summary
        # Only runs when the roast step failed. Re-runs just the failed files
        # (from `.prove`) serially and verbosely, so the actionable failure
        # output is grouped at the end of the job log instead of buried in the
        # truncated parallel run. A flaky concurrency test that passes here is
        # itself a useful signal (intermittent, not a hard regression).
        if: failure()
        run: |
          echo "::group::Failed roast files — Test Summary Report"
          grep -E "Result:|Failed |Test Summary|Dubious|wstat|Files=" tmp/roast.log || true
          echo "::endgroup::"
          echo "::group::Failed roast files — serial verbose re-run"
          prove --state=failed -v --merge -e 'scripts/run-roast-test.sh' || true
          echo "::endgroup::"
        env:
          MUTSU_BIN: target/release/mutsu

      - name: Crash reports (fatal signals)
        # A `Wstat: 11 (Signal: SEGV)` line in the summary above names neither
        # the process that faulted nor the place. src/crash_report/ writes one
        # <pid>.txt per crashed process; print them here so the answer is in
        # the job log the first time the crash fires.
        #
        # This covers every mutsu in the job — any t/ or roast file's own
        # interpreter, and any subprocess it spawned (each writes its own
        # report, told apart by pid and argv). That is why the job env sets an
        # ABSOLUTE MUTSU_CRASH_DIR: the default `tmp/crash` is resolved against
        # each process's startup working directory, so a subprocess spawned
        # with `:cwd`, or one inheriting a `chdir`, would drop its report in
        # some temp directory this step never looks at. Verified: with the
        # relative default, a `run(..., :cwd(...))` child's report lands under
        # that cwd instead.
        #
        # `always()` (not `failure()`): a report can exist on an otherwise
        # green job -- a deliberately-provoked subprocess crash a test
        # asserts on (see the allowlist in report-crash-reports.sh), or,
        # before this existed, a genuine crash whose job still passed. The
        # script itself now fails the job when a report is NOT on that
        # allowlist, so this step is where an unexpected crash actually
        # surfaces (todo/deep/procasync-stress-segv.md).
        if: always()
        run: scripts/report-crash-reports.sh

      - name: Upload roast log
        # Always upload the full (untruncated) roast log so a failure can be
        # diagnosed from the artifact even when the web log viewer truncates the
        # step. Retained briefly; this is a debugging aid, not a release artifact.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roast-log
          path: tmp/roast.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-reports
          path: tmp/crash/
          retention-days: 7
          if-no-files-found: ignore

      # ── Bundled-library gate (post-merge; see docs/batteries/testsuite-gate.md)
      #
      # `release.yml` runs this as the authoritative gate on a release. That is
      # the only place it ran, so a general interpreter change could break a
      # bundled module and nothing said a word until someone cut a release:
      # `Template::Mustache` sat on the whitelist at 6/13 for days and took the
      # v0.19.0 release run down with it. The pin tests in `t/` only cover bugs
      # already found; this is the net for the unknown ones.
      #
      # It runs on EVERY run of this job — every PR and every push to `main`.
      #
      # It used to run only post-merge and on a PR that touched the batteries
      # themselves, on the reasoning that an ordinary PR's merge path should not
      # depend on cloning 17 upstream repositories. That reasoning was wrong in
      # practice, and the failure mode is worse than the one it avoided: a
      # general interpreter change lands green, breaks a bundled library, and
      # the breakage is only discovered by the *next* batteries-touching PR,
      # which is then blocked by a regression it did not cause. That is exactly
      # what happened to `DBIish/01-basic.rakutest` — the block-lexical-sub
      # escape hatch took NativeCall's prelude helpers with it, dropping the
      # suite from 35/35 to 27/35 (news/2026-08/prelude-helper-not-block-lexical.md).
      # `make test` cannot catch these: the pin tests in `t/` only cover bugs
      # already found, and this is the net for the unknown ones.
      #
      # The cost is small: the suites take ~75s, this job has already built the
      # release binary for roast, and a documentation-only PR skips the whole
      # job anyway (see the `changes` job).
      - name: Bundled-library test suites
        # libssl for the OpenSSL / IO::Socket::SSL batteries' NativeCall at
        # runtime. The runner image already has it (toolset-2404's
        # `apt.common_packages`), so this is a guard that normally does
        # nothing, not an install -- and it carries its own `apt-get update`
        # because the job no longer runs one (see the "Install mold" step).
        run: |
          if ! dpkg -s libssl-dev >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y libssl-dev
          fi
          scripts/battery-testsuite.sh
        env:
          MUTSU_BIN: target/release/mutsu

  # REQUIRED STATUS CHECK. This job exists for its NAME: branch protection
  # requires `test`, and a required check that is never created leaves the PR
  # pending forever with no error anywhere (see the note at the top of this
  # file). Splitting the work into halves therefore keeps an aggregator here
  # rather than renaming the thing branch protection asks for.
  #
  # `build` is in `needs` as well as the two halves: a half that never ran
  # because the build failed reports `skipped`, and without the build's own
  # result this job could not tell that apart from a documentation-only skip.
  #
  # `if: always()` so it runs even when a half failed — without it the
  # aggregator would itself be skipped, and a skipped required check counts as
  # success. The body is what turns each half's result into this job's exit
  # status; a half that was skipped because an EARLIER job failed reports
  # `skipped`, so only `success` is accepted, and the documentation-only case
  # is recognised explicitly rather than inferred from a skip.
  test:
    needs: [changes, build, test-check, test-suites]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every half succeeded
        run: |
          set -u
          if [ "${{ needs.changes.outputs.docs-only }}" = "true" ]; then
            echo "Documentation-only change: the halves are skipped by design."
            exit 0
          fi
          rc=0
          for half in \
            "build=${{ needs.build.result }}" \
            "test-check=${{ needs.test-check.result }}" \
            "test-suites=${{ needs.test-suites.result }}"; do
            name="${half%%=*}"
            result="${half#*=}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              echo "::error::$name did not succeed (result: $result)"
              rc=1
            fi
          done
          exit $rc

  # Warnings only exist in the configuration you actually compile, and the
  # `test` job compiles exactly one: the default feature set on the host. The
  # two OTHER configurations mutsu ships were linted by nobody, and both had
  # rotted by 2026-09-06 -- 12 dead-code warnings with `jit` off (the Miri
  # job's feature set, and the release matrix's Cranelift-less fallback) and 35
  # on wasm32 (the published npm package), none of them visible to any check.
  # Cheap to keep honest: one clippy pass each, in parallel with the heavy jobs
  # so it costs no critical path.
  #
  # Skipped on a documentation-only change -- see the `changes` job.
  lint-configs:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    # 30, not 20: this job's cache is its own, and a cold restore compiles two
    # dependency sets from scratch (native minus cranelift, then all of them
    # again for wasm32) before either clippy pass starts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      # Its own cache: neither feature set matches the "ci-linux" jobs' build
      # artifacts (no cranelift in one, a different target triple in the
      # other), so sharing their key would only evict entries they still need.
      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "ci-lint-configs"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy (jit off)
        # Everything the JIT owns is `#[cfg(feature = "jit")]`, so a new
        # JIT-only item that forgets the gate shows up here as dead code.
        run: cargo clippy --no-default-features --features native --all-targets -- -D warnings

      - name: Clippy (wasm32 browser build)
        # `--lib` because that is all the browser package builds (see
        # scripts/build-npm-package.sh). This is the configuration where the
        # platform-gated paths (`#[cfg(unix)]` filesystem calls, the worker
        # pool, PCRE2) compile out, and where unused locals and dead helpers
        # pile up unseen.
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features --features wasm --lib -- -D warnings

      - name: Rustdoc (intra-doc links)
        # A fourth configuration nothing else compiles: rustdoc resolves every
        # `[`item`]` link and parses the prose as Markdown, so a stale link or
        # Raku angle-bracket syntax written outside backticks (`%h<k>`,
        # `Array[Type]`) only ever shows up here. `--document-private-items`
        # because almost every item in this crate is `pub(crate)`.
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items

  # ADR-0013 §4 phase 4: the acceptance gate for the GC's aliased-write
  # soundness. What ADR-0013 shipped is an *argument* about borrow provenance —
  # a `Gc` payload lives in a `GcBox`'s `UnsafeCell`, so the aliased `&mut` that
  # container mutation hands out has valid provenance. No ordinary test can see
  # that: a provenance violation is UB that happens to work, so `make test` and
  # the whole roast suite stay green either way. Miri turns the argument into a
  # check, and a future refactor can invalidate the argument with no observable
  # failure — which is why this is a REQUIRED check and not an informational
  # one. An informational job on a repo where every PR auto-merges is a job
  # nobody reads.
  #
  # It is expensive (~20-25 min, most of it compiling the crate to MIR), so it
  # is gated on the `gc-value` classification: only a change under `src/gc/**`
  # or `src/value/**` (plus this workflow and the classifier itself) can affect
  # the property, which is ~8% of merges measured over the last 300. Like the
  # docs-only skip above this must be a job-level `if:`, never a workflow-level
  # `paths` filter — a check run that is never created stays pending forever and
  # blocks the merge it was supposed to guard.
  miri:
    needs: changes
    if: needs.changes.outputs.gc-value == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Miri only ships on nightly, and the nightly must be PINNED: an unpinned
      # `nightly` silently changes the interpreter (and its Stacked Borrows
      # model) under the job, which would turn a toolchain update into what
      # looks like a soundness regression — on a required check. Bump this
      # deliberately, in its own PR, and read the diff in Miri's behaviour.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-01
          components: miri, rust-src

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "ci-miri"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo miri setup
        run: cargo miri setup

      # `--no-default-features --features native` drops the two things Miri
      # fundamentally cannot execute: the Cranelift JIT (it emits real machine
      # code) and FFI calls. Neither is reachable from the subset below.
      #
      # `gc::` selects the collector and `Gc` primitive tests, including
      # `gc_contents_mut_writes_through_a_shared_node` — the exact aliased-write
      # shape ADR-0013 made sound — and, because the filter is a substring
      # match, `value::value_gc::` too, which is the container side. Measured
      # 2026-08-02: 47 pass, 5 ignored, ~19s of interpretation (the wall clock is
      # dominated by compiling the crate to MIR).
      #
      # `gc::` does NOT match `value::native_cache_shapes::` or
      # `value::seq_body_shapes::` (no "gc::" substring in either path) —
      # ADR-0030's `SyncUnsafeCell` probes for the native `array[T]` decode
      # cache, and ADR-0034 phase 5's probes for `Seq`'s reification
      # `SyncUnsafeCell` + generation graveyard, each need their own explicit
      # invocation below, or this gate goes green having run none of them.
      #
      # It runs in TWO steps because only the second half can be leak-checked;
      # see the step comments below.
      #
      # One limit worth knowing before trusting a green run: Miri reports
      # `integer-to-pointer cast` on the NaN-boxed `Value`, so provenance
      # checking is precise for typed `Gc<T>` paths and best-effort through the
      # `Value` layer (`-Zmiri-strict-provenance` is unavailable to us for the
      # same reason). The `Mixin` overrides map was the other one until #5771
      # made it a `Gc<MixinOverrides>` node; `gc::soundness_smoke`'s
      # `a_mixin_rename_is_visible_through_an_alias` now covers it.
      #
      # `--test-threads=1` keeps a failure attributable to a single test.
      #
      # ── If a test makes this job too slow, mark it `#[cfg_attr(miri, ignore)]`
      # ── rather than dropping the subset or loosening the gate.
      # Miri interprets every step, so a test that hammers a race (threads ×
      # tens of thousands of iterations) can run for hours where it takes
      # milliseconds natively. `concurrent_buffer_and_drain_never_wraps_the_approx_count`
      # in `src/gc/gc_ptr.rs` is the worked example: 200k allocations across four
      # threads against a spinning drainer, ignored under Miri with a comment
      # saying why. Two conditions make that legitimate — say both in the
      # comment you leave:
      #   1. the property the test defends is NOT aliased-write provenance (the
      #      one thing this gate exists for), and
      #   2. something else still runs it natively (gc-stress, `make test`).
      # If a test IS about provenance and is too slow, shrink the test — do not
      # ignore it.
      # Step 1 — the primitive and container tests. These allocate only what they
      # assert on, so Miri's leak check stays ON here: a `Gc` node that outlives
      # its test is a collector bug worth failing for.
      - name: cargo miri test (GC / container primitives)
        env:
          # The GC's stats and verify hooks read the clock and the environment.
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo miri test --no-default-features --features native \
            --lib gc:: -- --test-threads=1 --skip gc::soundness_smoke
          cargo miri test --no-default-features --features native \
            --lib value::native_cache_shapes -- --test-threads=1
          cargo miri test --no-default-features --features native \
            --lib value::seq_body_shapes -- --test-threads=1

      # Step 2 — the VM-level half (`gc::soundness_smoke`): a real `Interpreter`
      # running a Raku program, so Miri watches the actual `gc_contents_mut` call
      # sites rather than the primitive alone. This is the coverage ADR-0013 §4
      # asked for, unblocked once startup stopped shelling out to `uname`.
      #
      # `-Zmiri-ignore-leaks` is REQUIRED here and is not a weakening of the
      # gate: a whole interpreter intentionally leaves memory live at exit —
      # process-lifetime statics (the env base tier, interned symbols) and
      # uncollected reference cycles, which is exactly the condition the cycle
      # collector exists to reclaim on demand rather than at teardown. Leak
      # reports would drown the provenance errors this job is here to catch.
      # Aliasing/provenance checking is UNAFFECTED by the flag.
      #
      # Measured 2026-08-03: 5 pass, ~245s of interpretation.
      - name: cargo miri test (VM call sites)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-ignore-leaks
        run: |
          cargo miri test --no-default-features --features native \
            --lib gc::soundness_smoke -- --test-threads=1

  wasm-e2e:
    # Skipped on a documentation-only change — see the `changes` job.
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          targets: wasm32-unknown-unknown

      # Own cache (wasm32 target artifacts differ from the native jobs). No mold
      # here: this builds for wasm32-unknown-unknown, whose linker is wasm-ld,
      # not the host cc — the `-fuse-ld=mold` flag would not apply.
      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "ci-wasm"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build npm package
        run: |
          scripts/build-npm-package.sh
          mv pkg site/pkg

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Concurrency runs on a cooperative scheduler in the browser (no threads
      # there), so it needs its own checks. No browser required — this drives
      # pkg/ straight from Node.
      - name: Run WASM concurrency tests
        run: node site/concurrency.test.mjs

      # `playwright install --with-deps` shells out to apt-get internally, so
      # it hits the azure.archive.ubuntu.com mirror hang observed on
      # 2026-08-19 (PRs #6684 #6691) even though this job has no apt-get line
      # of its own. The native jobs stopped running apt unconditionally
      # (#7956) and keep this pin only inside their fallback branches; this
      # job genuinely cannot avoid apt, so it keeps the pin up front.
      - name: Use canonical apt mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list 2>/dev/null || true

      - name: Install Playwright
        run: |
          npm install playwright
          # `--with-deps` is the only apt consumer in this job and can hang
          # when the Ubuntu mirror stalls; ubuntu-latest already ships the
          # shared libraries Chromium needs.
          npx playwright install chromium

      - name: Run E2E tests
        run: node site/e2e.test.mjs

  # ── `gc-stress`, first half: the unit tests and the TAP suite under GC=on ─
    # Runs the whole test + roast suite with the GC cycle collector ON
    # (design doc §9.3's `GC=on` stress job). `MUTSU_GC_EVERY_CANDIDATE=N`
    # collects a cycle every N candidate pushes at the next safepoint, and
    # `MUTSU_GC_VERIFY=1` checks the collector's soundness invariants around each
    # collect. The point: the collector, exercised against every program in the
    # suite, must never corrupt live data. Cross-thread scans run under the
    # cooperative stop-the-world (design §6.1).
    #
    # N=1024, not 64: the trigger fires a FULL trial-deletion scan whose cost
    # is O(live suspect graph), so a small period is quadratic on workloads
    # that grow a large live structure while churning candidates —
    # S17-lowlevel/cas-loop.t (4x1000 cas ops building a linked list) ran
    # >180s at N=64 (8500+ collects x ~4300 traced nodes each) vs 3.3s at
    # N=1024, blowing the 30s per-file roast budget. 1024 still drives
    # thousands of collects across the suite (the soundness/VERIFY coverage
    # the job exists for) without turning the stress knob into a de facto
    # different asymptotic class. The production default-on trigger will use
    # a buffer-size threshold with adaptive backoff instead (ADR-0003).
    #
    # EVERY step is a BLOCKING gate (roast promoted 2026-07-05 after the
    # advisory-era failure classes were fixed — #4205/#4213/#4215): `cargo
    # test` (collector unit tests + gc_stress integration tests), `prove t/`,
    # the roast whitelist, and the final "No GC verify violations" step (any
    # `VERIFY FAIL` in the suite = heap corruption). A failure anywhere here
    # is a real GC regression.
    #
  #
  # This half owns everything that runs on a DEBUG binary: `cargo test` (which
  # builds that binary as a side effect, which is why the explicit debug build
  # below measures 0s) and `prove t/`. The roast half is a separate job —
  # they are independent, and welding them together made the job as long as
  # their sum and its red check say nothing about which one failed.
  #
  # Skipped on a documentation-only change — see the `changes` job.
  gc-stress-tap:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUTSU_GC: "on"
      MUTSU_GC_EVERY_CANDIDATE: "1024"
      MUTSU_GC_VERIFY: "1"
      # Absolute, so every mutsu in the process tree reports to the one place
      # the crash-report step collects.
      MUTSU_CRASH_DIR: ${{ github.workspace }}/tmp/crash
      # Link with mold (installed below); shared with the other native jobs.
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      # The "ci-linux" dependency cache, shared with the other two jobs that
      # compile a debug build — see the `build` job for why the release build
      # keeps a separate key.
      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "ci-linux"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Link with mold instead of GNU ld — see the `build` job for why it comes
      # from its own release tarball rather than from apt.
      - name: Install mold
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        with:
          mold-version: '2.42.0'
          make-default: false

      # A guard, not an install — see the `test-suites` job for the reasoning,
      # and for why the apt mirror pin sits inside the fallback branch.
      - name: Ensure prove is available
        run: |
          if ! command -v prove >/dev/null; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
            fi
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list 2>/dev/null || true
            sudo apt-get update && sudo apt-get install -y perl
          fi
          prove --version | head -1

      - name: Unit + integration tests (GC on)
        # Single-threaded: with MUTSU_GC=on, parallel in-process test threads
        # share the process-global collector state (candidate buffer, mutator
        # worker count, STW flags), so an interpreter test's safepoint collect
        # can steal another test's buffered candidates or react to its fake
        # registered workers — intermittent unit-test failures that are test
        # isolation artifacts, not GC bugs (seen: buffering_marks_purple_and_
        # dedupes, collect_is_deferred_while_a_mutator_worker_is_active,
        # stw_times_out_against_a_non_cooperating_worker). Serializing tests
        # removes the cross-talk; the multi-threaded GC coverage lives in the
        # subprocess-based tests/gc_stress.rs and the prove t/ suite below.
        # Costs ~1s over the parallel run.
        run: cargo test -- --test-threads=1
        env:
          RUST_MIN_STACK: 8388608

      - name: Build (debug, for TAP tests)
        # Normally 0s: the `cargo test` step above already built the bin target.
        # It stays because the dependency is a side effect, not a contract.
        run: cargo build

      - name: TAP tests (prove t/, GC on)
        # BLOCKING since the DESTROY-on-reclaim / dead-sweep slice: the whole
        # t/ suite passes under GC=on, so a failure here is a real GC
        # regression (semantics or soundness), not a known gap.
        #
        # `-j4`, matching the roast step below, the `test` job's TAP step and
        # the ubuntu-latest core count. This suite ran fully SERIAL here until
        # 2026-09-11 and that, not the debug binary, was the dominant cost of
        # the job: the `test` job runs the same 3997 files at `-j4` in 1m28s
        # against 15m53s (gc-stress) / 18m42s (jit-stress) serial, a 10.8x /
        # 12.7x gap of which a debug build explains only ~3x. Both jobs were
        # habitually spending ~90% of `timeout-minutes: 30` as a result, so a
        # single slow `apt` step cancelled them with every test green (#7956).
        #
        # Nothing is lost by parallelising. `MUTSU_GC` / `MUTSU_JIT` and their
        # knobs are per-process runtime settings read by each `mutsu` prove
        # spawns, so each file is exercised under exactly the configuration
        # this job exists to test, whether four of them run at once or one
        # does. `--merge` keeps each file's stderr attached to its own test
        # under interleaved `-j` output, same reasoning as the roast step.
        #
        # `MUTSU_T_TIMEOUT` 60 -> 90: the per-file budget now has to cover CPU
        # contention from three sibling test processes on top of the debug
        # binary, where before it covered the debug binary alone. Headroom on
        # a budget that only ever fires for the heaviest file is free; a
        # timeout that fires because the runner was busy is not (see
        # docs/flaky-test-policy.md 3, which prefers widening the budget to
        # quarantining a slow-but-correct test).
        run: |
          set -o pipefail
          mkdir -p tmp
          prove -r -j4 --merge -e 'scripts/run-t-test.sh' t/ 2>&1 | tee tmp/gc-stress-t.log
        env:
          MUTSU_BIN: target/debug/mutsu
          MUTSU_T_TIMEOUT: "90"

      - name: Flaky quarantine retries used (GC on)
        if: always()
        run: scripts/report-flaky-retries.sh

      - name: No GC verify violations (TAP)
        # `MUTSU_GC_VERIFY` logs `VERIFY FAIL` to stderr but does not by itself
        # fail the process, so a heap-corruption bug could pass unnoticed. Fail
        # the job if any collect reported a soundness violation.
        #
        # This half greps ITS OWN log only. The grep used to cover both logs at
        # the end of one job; with the halves separated, each must check the
        # file it produced, and neither may quietly pass because the other's
        # file is absent — hence the explicit "log is missing" branch.
        run: |
          if [ ! -f tmp/gc-stress-t.log ]; then
            echo "::error::tmp/gc-stress-t.log is missing — the TAP step did not run"
            exit 1
          fi
          if grep -q "VERIFY FAIL" tmp/gc-stress-t.log; then
            echo "::error::GC collector reported VERIFY FAIL under TAP stress"
            grep -n "VERIFY FAIL" tmp/gc-stress-t.log | head -30
            exit 1
          fi
          echo "No GC verify violations across the TAP suite."

      - name: Crash reports (fatal signals, GC on)
        # `always()`, not `failure()` -- see the "Crash reports (fatal
        # signals)" step above for why (todo/deep/procasync-stress-segv.md).
        if: always()
        run: scripts/report-crash-reports.sh

      - name: Upload GC stress TAP crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gc-stress-tap-crash-reports
          path: tmp/crash/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload GC stress TAP log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gc-stress-tap-log
          path: tmp/gc-stress-t.log
          retention-days: 7
          if-no-files-found: ignore

  # ── `gc-stress`, second half: the roast whitelist under GC=on ────────────
  #
  # Same collector configuration as `gc-stress-tap` (see the comment there);
  # this half runs the roast whitelist on the shared release binary and
  # compiles nothing.
  #
  # Skipped on a documentation-only change — see the `changes` job.
  gc-stress-roast:
    needs: [changes, build]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUTSU_GC: "on"
      MUTSU_GC_EVERY_CANDIDATE: "1024"
      MUTSU_GC_VERIFY: "1"
      # GC=on + VERIFY runs the roast suite ~2x slower across the board;
      # scale every per-file timeout accordingly (see run-roast-test.sh) —
      # S17-lowlevel/thread.t sat at ~24s against the 30s GC-off budget and
      # timed out on a loaded runner the first time this step ran blocking.
      # Read only by run-roast-test.sh, so it belongs to this half.
      MUTSU_ROAST_TIMEOUT_SCALE: "2"
      # Absolute, so every mutsu in the process tree reports to the one place
      # the crash-report step collects.
      MUTSU_CRASH_DIR: ${{ github.workspace }}/tmp/crash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Download the release binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutsu-release-binary
          path: target/release

      - name: Restore the binary
        # Two things the artifact does not carry, both of which this step puts
        # back. (1) The executable bit: an artifact is a zip, so the downloaded
        # file arrives mode 644 and every `prove -e` below would die with
        # "Permission denied". (2) Its place in the tree: bundled batteries are
        # resolved relative to the executable (`target/<profile>/../../modules`),
        # so the binary has to land back inside the checkout it was built from,
        # which is why the download path above is `target/release` and not a
        # scratch directory. `--version` then proves both at once — a wrong mode
        # or a truncated download fails here, in a two-second step, instead of
        # once per test file for the rest of the job. Same shape as
        # ecosystem-sweep.yml's "Restore the binary layout and the index cache".
        run: |
          set -euo pipefail
          chmod +x target/release/mutsu
          target/release/mutsu --version

      # A guard, not an install — see the `test-suites` job for the reasoning,
      # and for why the apt mirror pin sits inside the fallback branch.
      - name: Ensure prove is available
        run: |
          if ! command -v prove >/dev/null; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
            fi
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list 2>/dev/null || true
            sudo apt-get update && sudo apt-get install -y perl
          fi
          prove --version | head -1

      - name: Clean precomp cache and restore roast files
        run: |
          rm -rf ~/.cache/mutsu/precomp
          git checkout -- roast/

      - name: Roast tests (make roast, GC on)
        # BLOCKING (promoted 2026-07-05): the whole whitelist passes under
        # GC=on since the three advisory-era failure classes were fixed — STW
        # spawn-churn starvation (#4205), shared-env phantom edges (#4213),
        # and the EVERY_CANDIDATE=64 quadratic (#4215, knob now 1024). A
        # failure here is a real GC regression, same as the TAP half.
        # Keep `set -o pipefail` so prove's exit status survives the tee.
        run: |
          set -o pipefail
          mkdir -p tmp
          prove -j4 --merge -e 'scripts/run-roast-test.sh' \
            $(cat roast-whitelist.txt) 2>&1 | tee tmp/gc-stress-roast.log
        env:
          MUTSU_BIN: target/release/mutsu

      - name: Flaky quarantine retries used (GC on)
        if: always()
        run: scripts/report-flaky-retries.sh

      - name: No GC verify violations (roast)
        # See the same step in `gc-stress-tap`: each half greps its own log,
        # and a missing log is a failure rather than a silent pass.
        run: |
          if [ ! -f tmp/gc-stress-roast.log ]; then
            echo "::error::tmp/gc-stress-roast.log is missing — the roast step did not run"
            exit 1
          fi
          if grep -q "VERIFY FAIL" tmp/gc-stress-roast.log; then
            echo "::error::GC collector reported VERIFY FAIL under roast stress"
            grep -n "VERIFY FAIL" tmp/gc-stress-roast.log | head -30
            exit 1
          fi
          echo "No GC verify violations across the roast suite."

      - name: Crash reports (fatal signals, GC on)
        # `always()`, not `failure()` -- see the "Crash reports (fatal
        # signals)" step above for why (todo/deep/procasync-stress-segv.md).
        if: always()
        run: scripts/report-crash-reports.sh

      - name: Upload GC stress roast crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gc-stress-roast-crash-reports
          path: tmp/crash/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload GC stress roast log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gc-stress-roast-log
          path: tmp/gc-stress-roast.log
          retention-days: 7
          if-no-files-found: ignore

  # REQUIRED STATUS CHECK. This job exists for its NAME: branch protection
  # requires `gc-stress`, and a required check that is never created leaves the PR
  # pending forever with no error anywhere (see the note at the top of this
  # file). Splitting the work into halves therefore keeps an aggregator here
  # rather than renaming the thing branch protection asks for.
  #
  # `if: always()` so it runs even when a half failed — without it the
  # aggregator would itself be skipped, and a skipped required check counts as
  # success. The body is what turns each half's result into this job's exit
  # status; a half that was skipped because an EARLIER job failed reports
  # `skipped`, so only `success` is accepted, and the documentation-only case
  # is recognised explicitly rather than inferred from a skip.
  gc-stress:
    needs: [changes, build, gc-stress-tap, gc-stress-roast]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every half succeeded
        run: |
          set -u
          if [ "${{ needs.changes.outputs.docs-only }}" = "true" ]; then
            echo "Documentation-only change: the halves are skipped by design."
            exit 0
          fi
          rc=0
          for half in \
            "build=${{ needs.build.result }}" \
            "gc-stress-tap=${{ needs.gc-stress-tap.result }}" \
            "gc-stress-roast=${{ needs.gc-stress-roast.result }}"; do
            name="${half%%=*}"
            result="${half#*=}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              echo "::error::$name did not succeed (result: $result)"
              rc=1
            fi
          done
          exit $rc

  # ── `jit-stress`, first half: the TAP suite with the JIT forced hot ──────
    # Runs the whole test + roast suite with the Cranelift JIT forced hot
    # (ADR-0004 §2.5 J2, same shape as gc-stress). MUTSU_JIT defaults to ON
    # since J5, so the main test job already covers the default (threshold
    # 100) configuration; this job's stress value is MUTSU_JIT_THRESHOLD=2,
    # which compiles every Tier A-eligible chunk on its second call, so
    # JIT-compiled bodies (not the interpreter) execute for essentially all
    # repeatedly-called code in the suite. The JIT's correctness contract is
    # byte-identical output to the interpreter, so every step is a BLOCKING
    # gate: any failure here that does not reproduce with MUTSU_JIT=off is a
    # JIT codegen/shim bug.
  #
  # Split into a TAP half and a roast half for the same reasons as gc-stress:
  # the two are independent, and a red check should name which one failed.
  #
  # Skipped on a documentation-only change — see the `changes` job.
