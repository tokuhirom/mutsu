# Which issue tracks each benchmark row that mutsu loses.
#
# scripts/bench-visualize.py reads this file to render the bench-trend
# dashboard's "mutsu is slower here" section: every row whose median ratio over
# the last commits is above 1.0x against rakudo or rakupp is listed there, worst
# first, with the issues named here linked next to it. A losing row with no
# entry is shown as "no tracking issue" and the generator warns about it.
#
# One table per benchmark, keyed by the name its dashboard card carries (`+jit`
# stripped, `@section` kept). Keys:
#
#   issues  open `todo:perf` (or `todo:deep`) issues on tokuhirom/mutsu whose
#           work closes the gap on this row, most specific first
#   survey  an anchor in docs/rakupp-gap-survey.md that explains the row
#   note    one plain-text sentence shown with the links (no markup)
#
# A row that has no issue gets one before it gets an entry: a `todo:perf`
# issue on `lane:perf`, close condition "ratio <= 1.0x vs <rakudo|rakupp> on
# the bench CI median". An entry may outlive its row's loss (rows near 1.0x
# cross it both ways); it is then simply not listed. Remove it with its issue.

["bench-json-fast-spdx@section"]
issues = [8673]
note = "Against rakudo this is engine against engine; against rakupp it is not (rakupp parses JSON natively)."

["bench-json-fast"]
issues = [8673]
survey = "what-rakupp-actually-runs"
note = "Loses only to rakupp's native C++ JSON parser; ratio vs rakudo is the comparable number."

