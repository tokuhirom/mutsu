<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mutsu Ecosystem Compatibility — does your module work?</title>
<meta name="description" content="Every zef distribution's own test suite, run under both rakudo and mutsu. Search for a module to see whether it works on mutsu, how much of its suite passes, and why the rest does not.">
<link rel="stylesheet" href="assets/site.css">
<style>
  .eco-kpis { display: flex; flex-wrap: wrap; gap: 1.5rem; margin: 1.5rem 0 0.5rem; }
  .eco-kpi { min-width: 9rem; }
  .eco-kpi-val { font-size: 2rem; font-weight: 700; line-height: 1.1; }
  .eco-kpi-key { font-size: 0.85rem; opacity: 0.75; }
  .eco-chart { margin: 1.5rem 0; }
  .eco-chart img { width: 100%; height: auto; }
  .eco-controls { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;
                  margin: 1.5rem 0 0.75rem; }
  .eco-controls input[type="search"] { flex: 1 1 16rem; padding: 0.5rem 0.7rem;
                  font: inherit; border: 1px solid rgba(128,128,128,0.45);
                  border-radius: 6px; background: transparent; color: inherit; }
  .eco-controls select { padding: 0.5rem; font: inherit; border-radius: 6px;
                  border: 1px solid rgba(128,128,128,0.45);
                  background: transparent; color: inherit; }
  .eco-table-wrap { overflow-x: auto; }
  table.eco { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  table.eco th, table.eco td { text-align: left; padding: 0.45rem 0.6rem;
                  border-bottom: 1px solid rgba(128,128,128,0.22); vertical-align: top; }
  table.eco th { position: sticky; top: 0; background: var(--bg, #fff); }
  table.eco td.eco-dist { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                  white-space: nowrap; }
  td.eco-reason { opacity: 0.8; }
  .eco-badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px;
                  font-size: 0.8rem; white-space: nowrap; }
  .s-green        { background: rgba(4,120,87,0.16);  color: #047857; }
  .s-partial      { background: rgba(180,83,9,0.16);  color: #b45309; }
  .s-red          { background: rgba(190,24,60,0.16); color: #be123c; }
  .s-blocked_load { background: rgba(109,40,217,0.14); color: #6d28d9; }
  .s-blocked_dep  { background: rgba(107,114,128,0.18); color: #4b5563; }
  .s-no_baseline  { background: rgba(107,114,128,0.14); color: #6b7280; }
  .s-skipped      { background: rgba(107,114,128,0.14); color: #6b7280; }
  @media (prefers-color-scheme: dark) {
    table.eco th { background: var(--bg, #0d1117); }
    .s-green { color: #4ade80; } .s-partial { color: #f0b429; }
    .s-red { color: #fb7185; }   .s-blocked_load { color: #c4b5fd; }
    .s-blocked_dep, .s-no_baseline, .s-skipped { color: #9ca3af; }
  }
</style>
</head>
<body>

<nav class="site-nav"></nav>

<div class="container">
  <header class="page-head">
    <h1 id="page-title"></h1>
    <p class="page-intro" id="page-intro"></p>
    <p class="install-note" id="page-method"></p>
  </header>

  <section class="eco-kpis" id="eco-kpis"></section>
  <p class="bat-count" id="eco-provenance"></p>

  <section class="eco-chart" id="eco-chart" hidden>
    <img src="history.svg" alt="mutsu ecosystem parity against rakudo, over time" loading="lazy">
  </section>

  <div class="eco-controls">
    <input type="search" id="eco-search" autocomplete="off">
    <select id="eco-status"></select>
  </div>

  <p class="bat-count" id="eco-shown"></p>

  <div class="eco-table-wrap">
    <table class="eco">
      <thead><tr id="eco-head"></tr></thead>
      <tbody id="eco-rows"></tbody>
    </table>
  </div>
</div>

<footer class="site-footer"></footer>

<script type="module">
import { renderChrome, currentLang } from './assets/i18n.js';

renderChrome('ecosystem');

/* The page is a projection of ecosystem/dists/**.json, generated by
 * scripts/gen-ecosystem-manifest.py. Everything below only renders it. */

const EN = {
  title: 'Ecosystem compatibility',
  intro: 'Every zef distribution’s own test suite, run under both rakudo and mutsu. ' +
         'Search for a module to see whether it works, how much of its suite passes, and why the rest does not.',
  method: 'rakudo is the baseline: a test file rakudo does not pass cleanly is left out of the ' +
          'numbers entirely, never counted against mutsu. Both interpreters run the same sources, ' +
          'the same dependencies and the same timeout.',
  distParity: 'distributions fully passing',
  fileParity: 'test files passing',
  measured: 'measured',
  coverage: (n, total, pct) =>
    `${n} of ${total} distributions measured (${pct}%) — the sweep runs shard by shard, ` +
    `so these figures speak for the part of the ecosystem measured so far, not all of it`,
  coverageAll: (total) => `all ${total} distributions measured`,
  search: 'Search for a distribution…',
  allStatuses: 'All statuses',
  shown: (n, total) => `${n} of ${total} distributions`,
  colDist: 'Distribution', colVersion: 'Version', colStatus: 'Status',
  colFiles: 'Files', colReason: 'Why',
  none: 'No distribution matches.',
  loading: 'Loading…',
  empty: 'No measurements yet — the corpus sweep has not run.',
  status: {
    green: 'works', partial: 'partly works', red: 'fails',
    blocked_load: 'does not load', blocked_dep: 'dependency missing',
    no_baseline: 'no rakudo baseline', skipped: 'skipped',
  },
};

const JA = {
  title: 'エコシステム互換性',
  intro: '各 zef ディストリビューション自身のテストスイートを、rakudo と mutsu の両方で実行した結果です。' +
         'モジュール名で検索すると、動くかどうか、スイートのどこまで通るか、通らない理由が分かります。',
  method: '基準は rakudo です。rakudo 自身が通らないテストファイルは数値から完全に除外され、mutsu の失敗としては数えません。' +
          '両インタプリタは同じソース・同じ依存・同じタイムアウトで実行されます。',
  distParity: '完全に通ったディストリビューション',
  fileParity: '通ったテストファイル',
  measured: '計測時点',
  coverage: (n, total, pct) =>
    `${total} 件中 ${n} 件を計測済み (${pct}%) — スイープはシャード単位で進むため、` +
    `これらの数値はエコシステム全体ではなく計測済みの範囲についてのものです`,
  coverageAll: (total) => `全 ${total} 件を計測済み`,
  search: 'ディストリビューションを検索…',
  allStatuses: 'すべての状態',
  shown: (n, total) => `${total} 件中 ${n} 件`,
  colDist: 'ディストリビューション', colVersion: 'バージョン', colStatus: '状態',
  colFiles: 'ファイル', colReason: '理由',
  none: '該当するディストリビューションはありません。',
  loading: '読み込み中…',
  empty: 'まだ計測がありません — コーパススイープが未実行です。',
  status: {
    green: '動作', partial: '一部動作', red: '失敗',
    blocked_load: 'ロード不可', blocked_dep: '依存が不足',
    no_baseline: 'rakudo 基準なし', skipped: 'スキップ',
  },
};

const L = () => (currentLang() === 'ja' ? JA : EN);

const els = {
  title: document.getElementById('page-title'),
  intro: document.getElementById('page-intro'),
  method: document.getElementById('page-method'),
  kpis: document.getElementById('eco-kpis'),
  provenance: document.getElementById('eco-provenance'),
  chart: document.getElementById('eco-chart'),
  search: document.getElementById('eco-search'),
  status: document.getElementById('eco-status'),
  shown: document.getElementById('eco-shown'),
  head: document.getElementById('eco-head'),
  rows: document.getElementById('eco-rows'),
};

let DATA = null;

function kpi(value, label) {
  const box = document.createElement('div');
  box.className = 'eco-kpi';
  const v = document.createElement('div');
  v.className = 'eco-kpi-val';
  v.textContent = value;
  const k = document.createElement('div');
  k.className = 'eco-kpi-key';
  k.textContent = label;
  box.append(v, k);
  return box;
}

function paintChrome() {
  const l = L();
  document.title = `mutsu — ${l.title}`;
  els.title.textContent = l.title;
  els.intro.textContent = l.intro;
  els.method.textContent = l.method;
  els.search.placeholder = l.search;

  els.head.innerHTML = '';
  for (const label of [l.colDist, l.colVersion, l.colStatus, l.colFiles, l.colReason]) {
    const th = document.createElement('th');
    th.textContent = label;
    els.head.appendChild(th);
  }

  if (!DATA) return;
  els.kpis.innerHTML = '';
  els.kpis.append(
    kpi(`${DATA.dist_parity}%`, `${l.distParity} (${DATA.counts.green}/${DATA.counts.graded})`),
    kpi(`${DATA.file_parity}%`, l.fileParity),
  );
  const m = DATA.measured || {};
  const corpus = DATA.counts.corpus ?? 0;
  const n = DATA.counts.distributions ?? 0;
  // A partial sweep must never publish a parity figure that reads as the whole
  // ecosystem's: say how much of the corpus these numbers speak for, first.
  const cov = corpus && n < corpus ? l.coverage(n, corpus, DATA.coverage ?? 0)
            : corpus ? l.coverageAll(corpus) : '';
  els.provenance.textContent =
    (cov ? cov + '  ·  ' : '') +
    `${l.measured}: ${m.date ?? '?'} · mutsu ${m.mutsu_version ?? '?'} (${m.mutsu_commit ?? '?'})` +
    ` · rakudo ${m.raku_version ?? '?'}`;

  const seen = [...new Set(DATA.distributions.map(d => d.status))];
  els.status.innerHTML = '';
  const all = document.createElement('option');
  all.value = '';
  all.textContent = l.allStatuses;
  els.status.appendChild(all);
  for (const s of seen) {
    const o = document.createElement('option');
    o.value = s;
    o.textContent = l.status[s] ?? s;
    els.status.appendChild(o);
  }
}

function paintRows() {
  const l = L();
  els.rows.innerHTML = '';
  if (!DATA) {
    els.shown.textContent = l.loading;
    return;
  }
  const needle = els.search.value.trim().toLowerCase();
  const wanted = els.status.value;
  const matches = DATA.distributions.filter(d =>
    (!wanted || d.status === wanted) &&
    (!needle || d.dist.toLowerCase().includes(needle)));

  els.shown.textContent = DATA.distributions.length
    ? l.shown(matches.length, DATA.distributions.length)
    : l.empty;

  if (!matches.length) {
    const tr = document.createElement('tr');
    tr.className = 'eco-empty';
    const td = document.createElement('td');
    td.colSpan = 5;
    td.textContent = DATA.distributions.length ? l.none : l.empty;
    tr.appendChild(td);
    els.rows.appendChild(tr);
    return;
  }

  // Render every match, not a capped slice. The default view is sorted
  // worst-first, so a cap hid whole status classes (every green distribution
  // fell past it) while the count above still claimed the full total -- the page
  // looked broken. One fragment, appended once, keeps a full corpus render cheap
  // enough to redo on each keystroke.
  const frag = document.createDocumentFragment();
  for (const d of matches) {
    const tr = document.createElement('tr');
    tr.className = 'eco-row';

    const name = document.createElement('td');
    name.className = 'eco-dist';
    name.textContent = d.dist;

    const version = document.createElement('td');
    version.textContent = d.version;

    const status = document.createElement('td');
    const badge = document.createElement('span');
    badge.className = `eco-badge s-${d.status}`;
    badge.textContent = l.status[d.status] ?? d.status;
    status.appendChild(badge);

    const files = document.createElement('td');
    files.textContent = d.baseline ? `${d.passed}/${d.baseline}` : '—';

    const reason = document.createElement('td');
    reason.className = 'eco-reason';
    reason.textContent = d.reason || '';

    tr.append(name, version, status, files, reason);
    frag.appendChild(tr);
  }
  els.rows.appendChild(frag);
}

els.search.addEventListener('input', paintRows);
els.status.addEventListener('change', paintRows);
window.addEventListener('langchange', () => { paintChrome(); paintRows(); });

paintChrome();
paintRows();

const EMPTY = { distributions: [], counts: { green: 0, graded: 0 },
                dist_parity: 0, file_parity: 0, measured: {}, has_chart: false };

fetch('content/ecosystem.json')
  .then(r => (r.ok ? r.json() : null))
  .then(data => { DATA = data ?? EMPTY; })
  .catch(() => { DATA = EMPTY; })
  .finally(() => {
    paintChrome();
    paintRows();
    // The KPI chart only exists once a full sweep has appended to history.tsv.
    // The manifest says whether it does, so the page never requests a file that
    // is not there.
    els.chart.hidden = !DATA.has_chart;
    document.body.dataset.ready = '1';
  });
</script>

</body>
</html>
